# variables-only-restore: a save that no longer matches, restored with the
# `VariablesOnly` policy, keeps only the Script Variables and the id
# counters, and reports the Runs, Deliveries and calls it discarded (spec
# chapter 10, "Variables-only restore").

kind = "trace"

[versions]
language = "1.0-rc"
costModel = "0"

[[operations]]
capability = "stock"
name = "check"
mode = "suspending"
args = ["text"]
result = "boolean"
cost = { fuel = 100 }

[[libraries]]
name = "fmt"
version = "1"
source = "fmt.talk"

[[scripts]]
name = "shop"
source = "shop.talk"
grants = { stock = { ops = ["check"] } }
