# preempted-join-keeps-pending-members: a Run preempted inside a Join's body,
# after starting members, is saved with them as pending calls, and each is
# settled on its own after the restore (spec chapter 10, "What a save holds"
# and "Settling pending calls"; chapter 5, "Joins").

kind = "trace"

[versions]
language = "1.0-rc.2"
costModel = "0"

[[operations]]
capability = "stock"
name = "check"
mode = "suspending"
args = ["text"]
result = "number"
cost = { fuel = 1 }
maxPending = 10000

[[scripts]]
name = "shop"
source = "shop.talk"
grants = { stock = { ops = ["check"] } }
