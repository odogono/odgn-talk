# undecided-on-cancel-delivery: a Host that can't wait cancels a Decision
# before its seal, which leaves it undecided, `cancelled` (ADR 0031, #79).
# Native runner tests separately check that a cancel after the seal queues
# nothing. Its Cost Model 0 figures agree on Go and TS; the corrected Trace
# awaits human review in docs/reviews/delivery-cancellation/.

kind = "trace"

[versions]
language = "1.0-rc.2"
costModel = "0"

[[operations]]
capability = "replay"
name = "record"
mode = "suspending"
args = ["any"]
result = "number"
cost = { fuel = 50 }

[[scripts]]
name = "board"
source = "board.talk"
grants = { replay = { ops = ["record"] } }
