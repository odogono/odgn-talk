# veto-ends-the-decision: a `veto` in the first `, deciding` clause seals the
# Decision as vetoed, ends the Run as `completed` after its `finally`, and
# ends the message, so the parent's Script never hears it (ADR 0031). Its
# figures are estimates, so it isn't blessed.

