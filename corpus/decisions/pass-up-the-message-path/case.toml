# pass-up-the-message-path: see case.trace for the rules and Cost Model 0 figures.

kind = "trace"

[versions]
language = "1.0-rc.2"
costModel = "0"

[[objectKinds]]
name = "board"
parentKinds = []

[[objectKinds]]
name = "piece"
parentKinds = ["board"]

[[objects]]
kind = "board"
id = "board"

[[objects]]
kind = "piece"
id = "knight"

# The pawn has no Owning Script, so a Decision addressed to it goes straight
# to its nearest ancestor that has one.
[[objects]]
kind = "piece"
id = "pawn"

[[scripts]]
name = "board"
source = "board.talk"
owner = { kind = "board", id = "board" }

[[scripts]]
name = "knight"
source = "knight.talk"
owner = { kind = "piece", id = "knight" }
