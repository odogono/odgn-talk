# undecided-when-dropped: a `, dropping` clause that drops a new Decision
# leaves it undecided, with outcome `dropped` (ADR 0031). Its figures are
# Cost Model 0's, blessed by the TS Core.

kind = "trace"

[versions]
language = "1.0-rc.2"
costModel = "0"

[[operations]]
capability = "replay"
name = "record"
mode = "suspending"
args = ["any"]
result = "number"
cost = { fuel = 50 }

[[scripts]]
name = "board"
source = "board.talk"
grants = { replay = { ops = ["record"] } }
