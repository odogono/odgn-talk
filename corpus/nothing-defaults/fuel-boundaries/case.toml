# fuel-boundaries: Cost Model 0's exact Fuel for Nothing defaults and
# optional reads, and the exact Fuel per Run budgets at which a Run faults
# immediately before `branch-not-nothing`, `pop`, `get-optional-key` and
# `get-optional-key-computed`, each at its own pc and source position (spec
# chapter 8, the lowering and Charging; design acceptance groups 2 and 10).

kind = "trace"

[versions]
language = "1.0-rc.3"
