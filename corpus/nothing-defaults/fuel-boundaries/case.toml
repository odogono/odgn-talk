source = "default.talk"
limits = { fuelPerRun = 5 }

[[scripts]]
name = "beforePop"
source = "default.talk"
limits = { fuelPerRun = 6 }

[[scripts]]
name = "beforeRead"
source = "default.talk"
limits = { fuelPerRun = 8 }

[[scripts]]
name = "computed"
