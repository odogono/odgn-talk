# host-objects: an optional read of a Host Object is its plain read (#2093).
# A defined property calls the Host with a `prop` record; an undefined one
# gives Nothing with no Host call; `id` is the Core-held id; a computed key
# reads the same property; a map stored under a property reads on
# optionally; a Guard skips its clause as a plain read there does; and a
# disposed object raises `object gone` for every key but `id`. Fuel matches
# the plain reads beside them (spec chapter 4, Optional key reads; design
# acceptance group 6).

kind = "trace"

[versions]
language = "1.0-rc.3"
costModel = "0"

[[objectKinds]]
name = "light"
props = [
  { name = "label", shape = "text", readOnly = true, getCost = { fuel = 2 } },
  { name = "lockable", shape = "any", readOnly = true, getCost = { fuel = 2 } },
]

[[objects]]
kind = "light"
id = "bulb-1"
props = { label = '"on"', lockable = '{is_locked: true}' }

[[scripts]]
name = "h"
source = "h.talk"
objects = { bulb = { kind = "light", id = "bulb-1" } }
