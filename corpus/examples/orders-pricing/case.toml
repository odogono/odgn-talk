# orders-pricing: a worked example of a Trace Case (spec chapter 11). Its
# figures are invented until Cost Model 1, so it isn't blessed.

kind = "trace"

[versions]
language = "1.0-rc"
costModel = "0"

# Operation Declarations, in the Host Manifest's data model. Ordered by name
# within their Capability.
[[operations]]
capability = "log"
name = "write"
mode = "fire-and-forget"
args = ["text"]
cost = { fuel = 20 }

[[operations]]
capability = "prices"
name = "lookup"
mode = "suspending"
args = ["text"]
result = { unitKind = "GBP" }
cost = { fuel = 100 }

[[scripts]]
name = "orders"
source = "orders.talk"
grants = { log = { ops = ["write"] } }
limits = { fuelPerRun = 20000 }

[[scripts]]
name = "pricing"
source = "pricing.talk"
grants = { prices = { ops = ["lookup"] } }

# Host Objects would be declared like this, and parented by `> set-parent`
# lines in case.trace. This case needs none.
