# orders-pricing: SKETCH of a Trace Case (ADR 0018), rewritten from the #24
# parity prototype. Key names are illustrative until the final spec.

[versions]
language = "1.0"
cost-model = "1"            # also pins the Abstract Machine (ADR 0010)

[limits]
fuel-per-run = 20000
alloc-per-run = 65536
persistent-state = 16384

# Operation Declarations, as data (ADR 0015). Ordered by name.
[[operations]]
capability = "log"
name = "write"
mode = "fire-and-forget"
args = ["text"]
cost = { fuel = 20 }

[[operations]]
capability = "prices"
name = "lookup"
mode = "suspending"
args = ["text"]
result = "quantity"
cost = { fuel = 100 }

[[scripts]]
name = "orders"
source = "orders.talk"
grants = { log = ["write"] }

[[scripts]]
name = "pricing"
source = "pricing.talk"
grants = { prices = ["lookup"] }

