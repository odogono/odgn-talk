# Unblessed: named Shapes' lowering (#2106); first blessing awaits human review.
# named-shapes: pins the lowering of Shape declarations (ADR 0168). The
# initialiser builds each Shape's data at its `shape` keyword, in chapter 9's
# canonical order, with local named Shapes inlined and an imported one read
# with `load-definition`; `is a` with a named Shape loads it and calls
# `conforms`, and `is a` with a kind is still `is-kind`.

kind = "disassembly"

