# Ordinary Capability calls retain early Join answers through body preemption,
# abandon in input order, and charge late answers atomically on resumption.
kind = "trace"
[versions]
language = "1.0-rc.2"
costModel = "0"
[[operations]]
capability = "api"
name = "fetch"
mode = "suspending"
args = ["number"]
result = "number"
cost = { fuel = 0 }
maxPending = 2000
errors = [{ code = "gone" }]
[[scripts]]
name = "s"
source = "s.talk"
grants = { api = { ops = "all" } }
limits = { fuelPerRun = 100 }
