# constant-unknown-name: an unknown name in a Constant initialiser, a Script
# Variable initialiser or a parameter default is both `unknown name` and
# `not constant`, at the same token, including as an `otherwise` fallback that
# would not run (spec chapter 2, Load-time diagnostics; #765).

