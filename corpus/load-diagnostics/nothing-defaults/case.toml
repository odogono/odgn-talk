# nothing-defaults: the load diagnostics of Nothing defaults and optional
# reads. A missing or unparenthesized operand; optional reads as Containers
# in `put`, `set`, `add`, `delete` and a nested Container; forbidden calls on
# either side of a default or in a computed key, in a Guard or a Whose
# condition, and unresolved names, even where they would not run;
# non-constant Constant and parameter-default operands; and the 1.0-rc.2 sources that no longer parse,
# `otherwise` as an Argument Label and as an ungrouped index (spec chapter 2,
# Load-time diagnostics; design acceptance groups 3, 7, 8 and 9).

kind = "trace"

[versions]
language = "1.0-rc.3"
costModel = "0"


