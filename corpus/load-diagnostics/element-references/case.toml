# element-references: Object Element References and Element Counts read Host
# state, so they are `not in a guard`, `not constant` and never Containers,
# and `set` cannot write one (#1143).
kind = "trace"
[versions]
language = "1.0-rc.3"
costModel = "0"
[[objectKinds]]
name = "page"
elements = { shape = { object = "page" }, countCost = { fuel = 1 }, atCost = { fuel = 1 }, findCost = { fuel = 1 } }
[[objects]]
kind = "page"
id = "main"

[[scripts]]
name = "guard-reference"
source = "guard-reference.talk"
objects = { thisPage = { kind = "page", id = "main" } }

