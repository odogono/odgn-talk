# sends: a `send` to a Host Object goes to its nearest Owning Script, and one
# to an object with none on its path is `unhandled`. A Command Call with no
# Handler sends the message up the Message Path from the parent of the
# Script's owner, and in a Script that owns nothing it is `unhandled`, as a
# `send … to me` there goes to the Script itself (spec chapter 5, Sending and
# The Message Path).

kind = "trace"

