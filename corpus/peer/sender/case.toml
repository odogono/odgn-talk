# peer/sender: one side of Remote Sends, from the sending Group. `reach`
# waits for the Host's Peer; a plain `send` to it is the Grant's `post`, and
# `send … and wait` its `call`, answered with the receiver's reply. A
# Peer handed back in the reply is a Peer of this Group (chapter 5, Remote
# Sends; ADRs 0153 and 0155).

