# host-commands-labels: an Operation marked `command` that declares labels has
# two Command Call spellings, its name with commas and its labelled call,
# each with its own Selector (ADR 0115; spec chapter 5, Calling a Handler by
# name). `both` calls `move` each way. In `shadow`, a Handler
# `on move piece to square` takes the labelled spelling, `move:to:`, while
# `move a, b` still calls the Operation, and `move a at b`, a Selector the
# Operation doesn't spell, is a message that climbs the Message Path, here
# unhandled. A `use` line names a single word, so a Library's labelled Handler
# can't be imported, and no Import can clash with a labelled spelling.

kind = "trace"

[versions]
language = "1.0-rc.3"
costModel = "0"

[[operations]]
capability = "world"
name = "move"
mode = "immediate"
args = ["text", "text"]
labels = ["to"]
result = "text"
cost = { fuel = 10 }
command = true

[[scripts]]
name = "both"
source = "both.talk"
grants = { world = { ops = "all" } }

[[scripts]]
name = "shadow"
source = "shadow.talk"
grants = { world = { ops = "all" } }
