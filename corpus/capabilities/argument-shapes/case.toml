# argument-shapes: an argument that breaks its Shape raises `wrong kind`
# before the Host function runs, and nothing is charged. Its fields describe
# the first node that doesn't match, depth-first, with `argument` and `path`;
# a missing key `got` "nothing" and an extra key in a closed map `expected`
# "nothing". A Function Value found by the data scan under `any` or an
# open map's undeclared field raises `not encodable`; other Shape mismatches
# raise `wrong kind` (spec chapter 6, Errors from Capabilities).

kind = "trace"

[versions]
language = "1.0-rc.3"
costModel = "0"

[[operations]]
capability = "forms"
name = "save"
mode = "fire-and-forget"
args = [{ map = [{ key = "name", shape = "text" }, { key = "tags", shape = { list = "text" } }, { key = "weight", shape = { optional = { quantity = "kg" } }, optional = true }, { key = "extra", shape = "any", optional = true }] }]
cost = { fuel = 5 }

[[scripts]]
name = "form"
source = "form.talk"
grants = { forms = { ops = ["save"] } }
