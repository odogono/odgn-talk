# Built on taito with:
# docker build -t odgn-talk-ci:2026-10-19-2 tools/ci
# Share the path condition between PRs and main pushes. Manual runs stay full.
when:
  - event: pull_request
    path: &paths
      include:
        - 'impl/ts/**'
        - 'impl/testdata/**'
        - 'corpus/**'
        - 'tools/syntax/**'
        - 'tools/grammar/**'
        - 'tools/machine/**'
        - 'tools/corpus/**'
        - 'tools/costs/**'
        - 'tools/envelope/**'
        - 'package.json'
        - 'bun.lock'
        - 'bunfig.toml'
        - '.bunfig.toml'
        - '.npmrc'
        - '.githooks/**'
        - '.gitattributes'
        - 'tsconfig.base.json'
        - 'tools/package.json'
        - 'tools/unicode/**'
        - 'spec/**'
        - 'tools/ci/Dockerfile'
        - '.woodpecker/linux.yaml'
        - 'impl/go/**'
        - 'tools/go/**'
      exclude:
        - 'impl/go/sqlite/**'
      on_empty: true
  - event: push
    branch: main
    path: *paths
  - event: manual

labels:
  backend: docker

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.10.1

steps:
  - name: workspace
    image: odgn-talk-ci:2026-10-19-2
    commands:
      - git config --global --add safe.directory "$PWD"
      - bun install --frozen-lockfile --network-concurrency 16
      - bun run unicode:check

  - name: ts-core
    when:
      - path:
          include:
            - 'impl/ts/**'
            - 'impl/testdata/**'
            - 'corpus/**'
            - 'tools/syntax/**'
            - 'tools/grammar/**'
            - 'tools/machine/**'
            - 'tools/corpus/**'
            - 'tools/costs/**'
            - 'tools/envelope/**'
            - 'package.json'
            - 'bun.lock'
            - 'bunfig.toml'
            - '.bunfig.toml'
            - '.npmrc'
            - '.githooks/**'
            - '.gitattributes'
            - 'tsconfig.base.json'
            - 'tools/package.json'
            - 'tools/unicode/**'
            - 'spec/**'
            - 'tools/ci/Dockerfile'
            - '.woodpecker/linux.yaml'
          on_empty: true
    image: odgn-talk-ci:2026-10-19-2
    depends_on: [workspace]
    directory: impl/ts
    commands:
      - bun test --timeout 30000 tests
      - bun run build
      - bun run corpus:run

  - name: go-core
    when:
      - path:
          include:
            - 'impl/go/**'
            - 'impl/testdata/**'
            - 'corpus/**'
            - 'tools/go/**'
            - 'tools/grammar/**'
            - 'tools/machine/**'
            - 'tools/corpus/**'
            - 'tools/costs/**'
            - 'tools/envelope/**'
            - 'package.json'
            - 'bun.lock'
            - 'bunfig.toml'
            - '.bunfig.toml'
            - '.npmrc'
            - '.githooks/**'
            - '.gitattributes'
            - 'tsconfig.base.json'
            - 'tools/package.json'
            - 'tools/unicode/**'
            - 'spec/**'
            - 'tools/ci/Dockerfile'
            - '.woodpecker/linux.yaml'
          exclude:
            - 'impl/go/sqlite/**'
          on_empty: true
    image: odgn-talk-ci:2026-10-19-2
    depends_on: [workspace]
    directory: impl/go
    environment:
      GOCACHE: /woodpecker-go-cache/${CI_REPO}/build
      GOMODCACHE: /woodpecker-go-cache/${CI_REPO}/modules
    commands:
      - go vet ./...
      - go test -count=1 ./...
      - go test -race -count=1 ./...
      - go run ./cmd/corpus --check-passing
