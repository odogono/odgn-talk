when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

labels:
  platform: linux/amd64
  backend: docker

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.10.1

steps:
  - name: workspace
    image: odgn-talk-ci:2026-10-19-2
    commands:
      - bun install --frozen-lockfile
      - bun run unicode:check

  - name: package
    image: odgn-talk-ci:2026-10-19-2-browser
    directory: impl/ts
    commands:
      - bunx playwright install chromium-headless-shell
      - bun run build
      - bun run package:check
