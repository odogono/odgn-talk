# Share the path condition between PRs and main pushes. Manual runs stay full.
when:
  - event: pull_request
    path: &paths
      include:
        - 'impl/ts/**'
        - 'impl/testdata/**'
        - 'tooling/**'
        - 'bench/ts/**'
        - 'corpus/**'
        - 'tools/**'
        - 'package.json'
        - 'bun.lock'
        - 'bunfig.toml'
        - '.bunfig.toml'
        - '.npmrc'
        - '.githooks/**'
        - '.gitattributes'
        - 'tsconfig.base.json'
        - 'tools/package.json'
        - 'tools/unicode/**'
        - 'spec/**'
        - '.woodpecker/tooling.yaml'
      exclude:
        - 'tools/sidecar/**'
        - 'tools/wasi/**'
        - 'tools/ci/Dockerfile.browser'
        - 'tools/ci/README.md'
      on_empty: true
  - event: push
    branch: main
    path: *paths
  - event: manual

labels:
  platform: linux/amd64
  backend: docker

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.10.1

steps:
  - name: workspace
    image: odgn-talk-ci:2026-10-19-2
    commands:
      - bun install --frozen-lockfile
      - bun run unicode:check

  - name: stack
    image: odgn-talk-ci:2026-10-19-2
    directory: tooling/stack
    commands:
      - bun test --timeout 30000 tests
      - bun run build
      - bun run test:node

  - name: tooling
    image: odgn-talk-ci:2026-10-19-2
    commands:
      - bun run typecheck
      - bun run lints:check
      - cd tooling/cli
      - bun test --timeout 30000 tests
      - bun run build
      - bun run test:node
      - cd ../editor
      - bun test --timeout 30000 tests
      - cd ../creative
      - bun test --timeout 30000 tests
      - cd ../vscode
      - bun test --timeout 30000 tests
      - bun run build

  - name: node-runtimes
    image: odgn-talk-ci:2026-10-19-2-node24
    directory: impl/ts
    environment:
      NORTHTALK_SQLITE_RUNTIMES: node
      NORTHTALK_NOTIFY_RUNTIMES: node
    commands:
      - node --version
      - bun test --timeout 30000 tests/sqlite-runtimes.test.ts tests/notify-runtimes.test.ts
