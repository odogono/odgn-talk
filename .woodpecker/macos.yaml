# PR sidecar checks run on GitHub-hosted macOS independently of this worker.
when:
  - event: push
    branch: main
    path:
      include:
        - 'impl/zig/**'
        - 'impl/testdata/**'
        - 'corpus/**'
        - 'tools/sidecar/**'
        - 'tools/zig/**'
        - 'package.json'
        - 'bun.lock'
        - 'bunfig.toml'
        - '.bunfig.toml'
        - '.npmrc'
        - '.githooks/**'
        - '.gitattributes'
        - 'tsconfig.base.json'
        - 'tools/package.json'
        - 'tools/unicode/**'
        - 'spec/**'
        - '.woodpecker/macos.yaml'
      on_empty: true
  - event: manual

labels:
  platform: darwin/arm64
  backend: local

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.10.1

steps:
  - name: workspace
    image: bash
    commands:
      - bun install --frozen-lockfile
      - bun run unicode:check

  - name: native-sidecar
    image: bash
    commands:
      - zig version
      - cd impl/zig
      - zig build sidecar
      - cd ../..
      - python3 tools/sidecar/check.py impl/zig/zig-out/bin/messagelayer
