<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: what should the #154 browser creative tool look like?
  Three structurally different editor layouts on one page, switchable via ?variant=A|B|C
  (floating bar at the bottom, or ← / → keys). All share one in-memory sample Project
  (an illustrated three-Page mystery). Nothing persists; reload resets. NorthTalk source
  shown in Scripts is illustrative, not checked against the Core.
  Verdict: B. In B, double-click an Element (Shift-double-click for text, or ⌘⌥-click) to open
  its Script in its own window; click a Message Path step to open that owner's Script.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Creative tool UI (#154)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: #1d1d1f; background: #e9e7e2; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }
  #app { height: 100%; }

  /* ---------- Page canvas (shared) ---------- */
  .fit { position: relative; width: 100%; }
  .fit-inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .page { position: relative; width: 720px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 30px rgba(0,0,0,.12); }
  .el { position: absolute; }
  .el.text { overflow: hidden; }
  .el.text p { margin: 0 0 .5em; }
  .el.btn { display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; box-shadow: 0 2px 0 rgba(0,0,0,.18); user-select: none; }
  .el.img svg { display: block; width: 100%; height: 100%; }
  .el.ellipse { border-radius: 50%; }
  .page.edit .el { cursor: move; }
  .page.edit .el.sel { outline: 2px solid #2f6fed; outline-offset: 1px; }
  .page.edit .el.sel.multi { outline-style: dashed; }
  .page.edit .el:hover:not(.sel) { outline: 1px solid rgba(47,111,237,.5); }
  .page.edit .el[contenteditable="true"] { cursor: text; outline: 2px solid #f0a020; }
  .handle { position: absolute; width: 12px; height: 12px; right: -7px; bottom: -7px; background: #fff; border: 2px solid #2f6fed; border-radius: 3px; cursor: nwse-resize; }
  .page.play .el.btn { cursor: pointer; }
  .page.play .el.btn:active { transform: translateY(1px); box-shadow: none; }
  .page.play .el.text.editable { outline: 1px dashed rgba(0,0,0,.25); cursor: text; }
  .page.play .el.text.editable:focus { outline: 2px solid #2f6fed; }
  .el .badge { position: absolute; top: -9px; right: -9px; width: 18px; height: 18px; border-radius: 9px; background: #6b4fd8; color: #fff; font: 600 10px/18px ui-monospace, monospace; text-align: center; pointer-events: none; }
  .page.play .el .badge { display: none; }

  /* ---------- Shared bits ---------- */
  .seg { display: inline-flex; background: rgba(0,0,0,.07); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; color: #444; }
  .seg button.on { background: #fff; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
  .ibtn { border: 0; background: transparent; padding: 5px 8px; border-radius: 6px; color: #333; }
  .ibtn:hover { background: rgba(0,0,0,.07); }
  .ibtn:disabled { opacity: .35; cursor: default; background: transparent; }
  .muted { color: #8a8780; }
  .saved { font-size: 12px; color: #6a8a5a; }
  .code { font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }
  .editor { display: flex; background: #1e1f24; color: #e6e6e6; border-radius: 6px; overflow: hidden; min-height: 0; }
  .editor .gutter { padding: 10px 8px 10px 10px; color: #6b6f7a; text-align: right; user-select: none; white-space: pre; background: #1a1b1f; }
  .editor .gutter .bad { color: #ff7a6b; }
  .editor textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: inherit; padding: 10px; white-space: pre; tab-size: 2; }
  .diag { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; background: #fdecea; color: #8b1f12; }
  .diag.ok { background: #e9f5e4; color: #2d5a1c; }
  .path { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .path span { padding: 1px 7px; border-radius: 10px; background: rgba(107,79,216,.1); color: #4a35a6; font-size: 11.5px; }
  .path span.cur { background: #6b4fd8; color: #fff; }
  .path i { font-style: normal; color: #aaa; font-size: 11px; }
  .recipe { text-align: left; border: 1px solid #e2ddd3; background: #fff; border-radius: 8px; padding: 7px 9px; }
  .recipe:hover { border-color: #6b4fd8; background: #faf8ff; }
  .recipe b { display: block; font-size: 12.5px; }
  .recipe small { color: #807b72; }
  .field { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 4px; }
  .field label { color: #8a8780; font-size: 11px; }
  .field input { width: 100%; min-width: 0; border: 1px solid #ddd8ce; border-radius: 5px; padding: 3px 5px; background: #fff; }
  input[type=color] { width: 28px; height: 24px; padding: 0 2px; border: 1px solid #ddd8ce; border-radius: 5px; background: #fff; }
  .fmt { display: inline-flex; gap: 2px; }
  .fmt button { width: 28px; height: 26px; border: 1px solid #ddd8ce; background: #fff; border-radius: 5px; }
  .fmt button:hover { background: #f2efe9; }

  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-80px); background: #1d1d1f; color: #fff; padding: 9px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .25s ease; z-index: 1000; max-width: 560px; font-size: 13px; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ---------- Play chrome (shared) ---------- */
  .play-wrap { height: 100%; display: flex; flex-direction: column; background: #2a2a2e; }
  .play-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #17171a; color: #ddd; }
  .play-bar .live { display: inline-flex; align-items: center; gap: 6px; color: #7ee08a; font-weight: 600; }
  .play-bar .live::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: #7ee08a; box-shadow: 0 0 8px #7ee08a; }
  .play-bar .state { font-size: 12px; color: #9a9aa2; }
  .play-bar .state b { color: #ddd; font-weight: 600; }
  .play-bar .seg { background: rgba(255,255,255,.08); }
  .play-bar .seg button { color: #bbb; }
  .play-bar .seg button.on { background: #444; color: #fff; }
  .pbtn { border: 0; border-radius: 7px; padding: 6px 12px; font-weight: 600; }
  .pbtn.stop { background: #c4372a; color: #fff; }
  .pbtn.back { background: #fff; color: #111; }
  .play-scroll { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 24px; }
  .play-scroll .frame { width: 100%; max-width: 720px; }
  .play-scroll.phone .frame { max-width: 390px; border: 10px solid #111; border-radius: 34px; overflow: hidden; height: 760px; overflow-y: auto; background: #111; flex-shrink: 0; }
  .play-scroll.phone .page { box-shadow: none; }

  /* ---------- Variant switcher (prototype only) ---------- */
  #switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; background: #ff3d7f; color: #fff; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.3); z-index: 999; font-weight: 600; }
  #switcher button { border: 0; background: rgba(255,255,255,.2); color: #fff; width: 30px; height: 30px; border-radius: 15px; font-size: 15px; }
  #switcher button:hover { background: rgba(255,255,255,.35); }
  #switcher span { padding: 0 10px; min-width: 210px; text-align: center; }

  /* =========================================================
     Variant A — Workbench: page rail | canvas | inspector
     ========================================================= */
  .A { height: 100%; display: grid; grid-template-rows: 48px 1fr; grid-template-columns: 168px 1fr 320px; }
  .A-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #fbfaf7; border-bottom: 1px solid #e0dcd3; }
  .A-top .logo { font-weight: 700; margin-right: 6px; }
  .A-top .proj { font-weight: 600; padding: 4px 8px; border-radius: 6px; }
  .A-top .sep { width: 1px; height: 22px; background: #e0dcd3; margin: 0 4px; }
  .A-top .grow { flex: 1; }
  .A-top .tool { display: inline-flex; flex-direction: column; align-items: center; gap: 0; font-size: 10.5px; padding: 3px 7px; }
  .A-top .tool .ic { font-size: 16px; line-height: 18px; }
  .A-pages { background: #f3f1ec; border-right: 1px solid #e0dcd3; overflow: auto; padding: 12px 14px; }
  .A-pages h4, .A-insp h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a8780; }
  .A-thumb { display: block; width: 100%; border: 0; background: transparent; padding: 0; margin-bottom: 12px; text-align: left; }
  .A-thumb .t { border-radius: 4px; overflow: hidden; outline: 2px solid transparent; outline-offset: 2px; }
  .A-thumb.on .t { outline-color: #2f6fed; }
  .A-thumb .n { font-size: 11.5px; margin-top: 4px; display: flex; gap: 4px; }
  .A-stage { overflow: auto; padding: 32px 40px 90px; }
  .A-stage .fit { max-width: 720px; margin: 0 auto; }
  .A-stage .pagesize { max-width: 720px; margin: 10px auto 0; color: #8a8780; font-size: 11.5px; text-align: center; }
  .A-insp { background: #fbfaf7; border-left: 1px solid #e0dcd3; display: flex; flex-direction: column; min-height: 0; }
  .A-insp .tabs { display: flex; border-bottom: 1px solid #e0dcd3; }
  .A-insp .tabs button { flex: 1; border: 0; background: transparent; padding: 10px; color: #777; border-bottom: 2px solid transparent; }
  .A-insp .tabs button.on { color: #111; font-weight: 600; border-bottom-color: #2f6fed; }
  .A-insp .body { padding: 14px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .A-insp .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .A-insp .row { display: flex; align-items: center; gap: 8px; }
  .A-insp .kind { display: flex; align-items: center; gap: 8px; }
  .A-insp .kind input { flex: 1; border: 1px solid #ddd8ce; border-radius: 5px; padding: 4px 6px; font-weight: 600; }
  .A-insp .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .A-insp .editor { flex: 1; min-height: 220px; }

  /* =========================================================
     Variant B — Stack: card on a desk, floating windoids, filmstrip
     ========================================================= */
  .B { height: 100%; display: flex; flex-direction: column; background: #d8d4cb; background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px); background-size: 14px 14px; }
  .B-menu { height: 30px; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: #fff; border-bottom: 1px solid #111; font-size: 13px; }
  .B-menu .m { padding: 4px 9px; border-radius: 4px; }
  .B-menu .m:hover { background: #111; color: #fff; }
  .B-menu .title { flex: 1; text-align: center; font-family: "Iowan Old Style", Georgia, serif; font-size: 14px; }
  .B-menu .play { border: 1.5px solid #111; background: #111; color: #fff; border-radius: 14px; padding: 2px 12px; font-weight: 700; margin-left: 8px; }
  .B-desk { flex: 1; overflow: auto; padding: 36px 290px 150px 110px; position: relative; }
  .B-desk .fit { max-width: 720px; margin: 0 auto; }
  .B-desk .page { border: 1.5px solid #111; box-shadow: 6px 6px 0 rgba(0,0,0,.85); }
  .win { position: absolute; background: #fff; border: 1.5px solid #111; box-shadow: 4px 4px 0 rgba(0,0,0,.8); z-index: 20; }
  .win .bar { height: 22px; display: flex; align-items: center; gap: 6px; padding: 0 6px; cursor: grab; font-size: 11.5px; font-weight: 600; user-select: none;
    background: repeating-linear-gradient(#fff 0 2px, #111 2px 3px); }
  .win .bar span { background: #fff; padding: 0 6px; }
  .win .bar .x { width: 12px; height: 12px; border: 1.5px solid #111; background: #fff; padding: 0; flex: none; }
  .B-tools { width: 72px; }
  .B-tools .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .B-tools .grid button { height: 34px; border: 0; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; background: #fff; font-size: 16px; }
  .B-tools .grid button:hover { background: #111; color: #fff; }
  .B-tools .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #777; padding: 5px 6px 3px; border-bottom: 1px solid #ddd; }
  .B-script { width: 380px; }
  .B-script .inner { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .B-script .editor { height: 230px; border-radius: 0; }
  .B-script .top { display: flex; align-items: center; gap: 6px; }
  .B-script select { border: 1.5px solid #111; border-radius: 0; padding: 3px; background: #fff; }
  .B-info { width: 220px; }
  .B-info .inner { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .B-info .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
  .B-info .field input, .B-info input[type=color], .B-info .fmt button { border-radius: 0; border-color: #111; }
  .B-film { position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: #fff; border-top: 1.5px solid #111; display: flex; align-items: center; gap: 14px; padding: 10px 16px 46px; overflow-x: auto; z-index: 15; }
  .B-film .card { flex: none; border: 0; background: transparent; padding: 0; text-align: center; font-size: 11px; }

  .B-film .card.on .t { box-shadow: 3px 3px 0 #ff3d7f; border-color: #ff3d7f; }
  .B-film .nav { font-size: 20px; border: 1.5px solid #111; background: #fff; width: 34px; height: 34px; border-radius: 17px; flex: none; }
  .B-film .add { flex: none; width: 96px; height: 62px; border: 1.5px dashed #111; background: transparent; font-size: 22px; margin-bottom: 16px; }
  .B-pagecap { max-width: 720px; margin: 0 auto 10px; display: flex; justify-content: space-between; font-family: "Iowan Old Style", Georgia, serif; font-size: 15px; }

  /* =========================================================
     Variant C — Outline: structure tree | canvas + context bar | docked script
     ========================================================= */
  .C { height: 100%; display: grid; grid-template-rows: 44px 1fr 300px; grid-template-columns: 250px 1fr; background: #f6f6f8; }
  .C-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #fff; border-bottom: 1px solid #e3e3e8; }
  .C-head .grow { flex: 1; }
  .C-head .crumb { font-weight: 600; }
  .C-tree { grid-row: 2 / 4; background: #fff; border-right: 1px solid #e3e3e8; overflow: auto; padding: 10px 6px 80px; }
  .C-tree .node { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; cursor: default; white-space: nowrap; }
  .C-tree .node:hover { background: #f1f1f5; }
  .C-tree .node.on { background: #2f6fed; color: #fff; }
  .C-tree .node.on .muted { color: rgba(255,255,255,.75); }
  .C-tree .node .ic { width: 18px; text-align: center; opacity: .8; }
  .C-tree .node .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .C-tree .node .sc { font: 600 10px ui-monospace, monospace; padding: 0 5px; border-radius: 4px; background: #ece8ff; color: #5b43c8; }
  .C-tree .node.on .sc { background: rgba(255,255,255,.25); color: #fff; }
  .C-tree .kids { margin-left: 16px; border-left: 1px solid #ececf0; padding-left: 4px; }
  .C-tree .sect { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #999; padding: 12px 8px 4px; }
  .C-tree .add { display: flex; gap: 4px; padding: 4px 8px; }
  .C-tree .add button { border: 1px dashed #ccc; background: transparent; border-radius: 6px; padding: 3px 8px; color: #666; }
  .C-mid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .C-ctx { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #fff; border-bottom: 1px solid #e3e3e8; min-height: 44px; flex-wrap: wrap; }
  .C-ctx .field { grid-template-columns: 14px 54px; }
  .C-ctx .vsep { width: 1px; height: 22px; background: #e3e3e8; }
  .C-ctx .insert { display: inline-flex; gap: 2px; }
  .C-ctx .insert button { border: 1px solid #e3e3e8; background: #fff; border-radius: 6px; padding: 3px 7px; }
  .C-ctx .insert button:hover { border-color: #2f6fed; }
  .C-canvas { flex: 1; overflow: auto; padding: 24px 40px 40px; }
  .C-canvas .fit { max-width: 720px; margin: 0 auto; }
  .C-dock { grid-column: 2; display: grid; overflow: hidden; grid-template-columns: 1fr 270px; background: #fff; border-top: 1px solid #e3e3e8; min-height: 0; }
  .C-dock .main { display: flex; flex-direction: column; min-height: 0; padding: 0 12px 54px; }
  .C-dock .tabs { display: flex; align-items: center; gap: 14px; height: 38px; }
  .C-dock .tabs button { border: 0; background: transparent; padding: 0; height: 38px; color: #777; border-bottom: 2px solid transparent; }
  .C-dock .tabs button.on { color: #111; font-weight: 600; border-bottom-color: #6b4fd8; }
  .C-dock .tabs .count { background: #c4372a; color: #fff; border-radius: 8px; padding: 0 5px; font-size: 10.5px; margin-left: 3px; }
  .C-dock .editor { flex: 1; }
  .C-dock .side { min-height: 0; border-left: 1px solid #e3e3e8; padding: 10px 12px 60px; overflow: auto; display: flex; flex-direction: column; gap: 6px; background: #fafafc; }
  .C-dock .side h4 { margin: 2px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #999; }
  .C-dock .prob { padding: 8px 2px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
</style>
</head>

<div id="app"></div>
<div id="toast"></div>

// Script owners are addressed by key: 'project', 'page:<id>' or 'el:<id>'.
function ownerByKey(key) {

  for (const pg of p.pages) { const el = pg.elements.find(e => e.id === id); if (el) return { key, type: 'element', obj: el, page: pg, label: `${KIND_NAME[el.kind]} “${el.name}”` }; }

}

// The Message Path from an owner. `open` makes each step open that owner's Script window (Variant B).
function messagePath(o = scriptOwner(), open = false) {
  const parts = [];
  if (o.type === 'element') parts.push({ t: o.label, key: o.key, cur: true });
  if (o.type !== 'project') parts.push({ t: `Page “${o.page.name}”`, key: `page:${o.page.id}`, cur: o.type === 'page' });
  parts.push({ t: `Project`, key: 'project', cur: o.type === 'project' });
  const step = p => open && !p.cur
    ? `<span data-action="openWin" data-key="${p.key}" title="Open this Script" style="cursor:pointer">${esc(p.t)}</span>`
    : `<span class="${p.cur ? 'cur' : ''}">${esc(p.t)}</span>`;
  return `<span class="path">${parts.map(step).join('<i>→</i>')}</span>`;

// Fake checker: just balances on/end, if/end if, repeat, tell — enough to show where diagnostics live.
function checkScript(src) {
  const stack = [];
  const lines = (src || '').split('\n');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim();
    if (!l || l.startsWith('--')) continue;
    let m;
    if ((m = l.match(/^on (\w+)/))) stack.push({ w: m[1], line: i + 1 });
    else if (/^if .* then$/.test(l)) stack.push({ w: 'if', line: i + 1 });
    else if (/^repeat\b/.test(l) || /^tell \w+$/.test(l)) stack.push({ w: l.split(' ')[0], line: i + 1 }); // one-line `tell g to op` isn't a block
    else if ((m = l.match(/^end (\w+)/))) {
      const top = stack.pop();
      if (!top) return { line: i + 1, msg: `\`end ${m[1]}\` has no matching \`on ${m[1]}\`` };
      if (top.w !== m[1]) return { line: i + 1, msg: `expected \`end ${top.w}\` to close line ${top.line}, found \`end ${m[1]}\`` };
    }
  }
  if (stack.length) { const t = stack.pop(); return { line: lines.length, msg: `missing \`end ${t.w}\` for the block opened on line ${t.line}` }; }
  return null;
}
function allDiagnostics() {
  const out = [];
  const p = S.project;
  const d0 = checkScript(p.script); if (d0) out.push({ owner: `Project “${p.name}”`, ...d0, sel: { owner: 'project' } });
  for (const pg of p.pages) {
    const d1 = checkScript(pg.script); if (d1) out.push({ owner: `Page “${pg.name}”`, ...d1, sel: { pageId: pg.id } });
    for (const e of pg.elements) { const d = checkScript(e.script); if (d) out.push({ owner: `${KIND_NAME[e.kind]} “${e.name}” on ${pg.name}`, ...d, sel: { pageId: pg.id, el: e.id } }); }
  }
  return out;
}

function elHTML(el, mode) {
  const sel = mode === 'edit' && S.sel.includes(el.id);
  const cls = ['el', { text: 'text', image: 'img', button: 'btn', rect: 'rect', ellipse: 'ellipse', line: 'line' }[el.kind]];
  if (sel) cls.push('sel'); if (sel && S.sel.length > 1) cls.push('multi');
  if (el.editable) cls.push('editable');
  let st = `left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;
  let inner = '';
  if (el.kind === 'text') { st += `font-family:${FONTS[el.font] || FONTS.sans};font-size:${el.size}px;color:${el.color};line-height:1.35;`; inner = el.html; }
  if (el.kind === 'image') inner = ASSETS[el.asset] || ASSETS.placeholder;
  if (el.kind === 'button') { st += `background:${el.fill};color:${el.color};border-radius:${el.radius || 8}px;`; inner = esc(el.label); }
  if (el.kind === 'rect') st += `background:${el.fill};border-radius:${el.radius || 0}px;`;
  if (el.kind === 'ellipse') st += `background:${el.fill};`;
  if (el.kind === 'line') st += `background:${el.fill};`;
  const editableNow = (mode === 'play' && el.editable) || (mode === 'edit' && S.editing === el.id);
  const badge = el.script && mode === 'edit' ? `<span class="badge">ƒ</span>` : '';
  const handle = sel && S.sel.length === 1 && S.editing !== el.id ? `<span class="handle" data-handle="${el.id}"></span>` : '';
  return `<div class="${cls.join(' ')}" data-el="${el.id}" style="${st}"${editableNow ? ' contenteditable="true"' : ''}>${inner}${badge}${handle}</div>`;
}
function pageHTML(pg, mode) {
  return `<div class="page ${mode}" data-page="${pg.id}" style="height:${pg.height}px;background:${pg.bg}">${pg.elements.map(e => elHTML(e, mode)).join('')}</div>`;
}
// A scaled page. `fixed` = fixed scale (thumbnails); otherwise fits container width.
function fitHTML(pg, mode, fixed) {
  return `<div class="fit" data-fitpage="${pg.id}" ${fixed ? `data-scale="${fixed}" style="width:${DESIGN_W * fixed}px;height:${pg.height * fixed}px"` : ''}><div class="fit-inner">${pageHTML(pg, mode)}</div></div>`;
}
function thumbHTML(pg, w, h) {
  const s = w / DESIGN_W;
  return `<div class="t" style="width:${w}px;height:${h ?? Math.min(pg.height * s, w * 0.9)}px;overflow:hidden;pointer-events:none">${fitHTML(pg, 'thumb', s)}</div>`;
}
function fitAll() {
  document.querySelectorAll('.fit').forEach(f => {
    const pg = pageById(f.dataset.fitpage) || S.project.pages.find(p => p.id === f.dataset.fitpage);
    const s = f.dataset.scale ? +f.dataset.scale : Math.min(1, f.clientWidth / DESIGN_W);
    f.firstElementChild.style.transform = `scale(${s})`;
    f.style.height = pg.height * s + 'px';
    f.dataset.cur = s;

function editorHTML(owner, rows) {

// ===================================================================
// Render + switcher
// ===================================================================
function render() {
  const app = document.getElementById('app');
  const stage = app.querySelector('[data-stage]'); const scroll = stage ? stage.scrollTop : 0;
  app.innerHTML = S.play ? PlayView() : ({ A: VariantA, B: VariantB, C: VariantC }[S.variant])();
  const st = app.querySelector('[data-stage]'); if (st) st.scrollTop = scroll;
  fitAll();
  renderSwitcher();
  if (S.editing) { const n = app.querySelector(`[data-el="${S.editing}"]`); if (n) { n.focus(); } }
}
function renderSwitcher() {
  document.getElementById('switcher').innerHTML = `<button data-sw="-1">‹</button><span>${S.variant} · ${VARIANTS[S.variant]}</span><button data-sw="1">›</button>`;
}
function cycle(d) {
  const keys = Object.keys(VARIANTS); S.variant = keys[(keys.indexOf(S.variant) + d + keys.length) % keys.length];
  const u = new URL(location); u.searchParams.set('variant', S.variant); history.replaceState(null, '', u);
  render();
}
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

// ===================================================================
// Editing actions
// ===================================================================
function snapshot() { S.undo.push(JSON.stringify(S.project)); S.redo = []; if (S.undo.length > 100) S.undo.shift(); }
function addEl(kind) {
  snapshot();
  const base = { id: 'e' + (++uid), kind, name: `${KIND_NAME[kind]} ${uid}`, x: 220 + (uid % 5) * 12, y: 180 + (uid % 5) * 12 };
  const d = { text: { w: 300, h: 80, font: 'sans', size: 20, color: '#222222', html: '<p>New text</p>' }, image: { w: 300, h: 200, asset: 'placeholder' },
    button: { w: 200, h: 52, label: 'Button', fill: '#2f6fed', color: '#fff', radius: 10 }, rect: { w: 200, h: 140, fill: '#d9d2c3' },
    ellipse: { w: 160, h: 160, fill: '#e8b04a' }, line: { w: 300, h: 3, fill: '#333333' } }[kind];
  const el = { ...base, ...d };
  const stage = document.querySelector('[data-stage]');
  if (stage) { const f = stage.querySelector('.fit'); const s = +f.dataset.cur || 1; el.y = Math.max(20, Math.round((stage.scrollTop + 120) / s)); }
  page().elements.push(el); S.sel = [el.id]; S.owner = null;
}
const ACTIONS = {
  add: d => addEl(d.kind),
  page: d => { S.pageId = d.id; S.sel = []; S.owner = null; },
  prevPage: () => { const ps = S.project.pages; const i = ps.findIndex(p => p.id === S.pageId); S.pageId = ps[(i - 1 + ps.length) % ps.length].id; S.sel = []; },
  nextPage: () => { const ps = S.project.pages; const i = ps.findIndex(p => p.id === S.pageId); S.pageId = ps[(i + 1) % ps.length].id; S.sel = []; },
  addPage: () => { snapshot(); const id = 'p' + (++uid); S.project.pages.push({ id, name: `Page ${S.project.pages.length + 1}`, height: 800, bg: '#ffffff', script: '', elements: [] }); S.pageId = id; S.sel = []; },
  dupPage: () => { snapshot(); const c = clone(page()); c.id = 'p' + (++uid); c.name += ' copy'; c.elements.forEach(e => e.id = 'e' + (++uid)); const ps = S.project.pages; ps.splice(ps.indexOf(page()) + 1, 0, c); S.pageId = c.id; toast('Duplicated — the copy is independent of the original.'); },
  selTree: d => { S.sel = [d.id]; S.owner = null; },
  owner: d => { S.owner = d.o; S.sel = []; S.aTab = 'script'; S.cTab = 'script'; },
  aTab: d => { S.aTab = d.t; },
  cTab: d => { S.cTab = d.t; },
  openWin: d => openWin(d.key),
  closeWin: d => { S.bWins = S.bWins.filter(w => w.key !== d.key); },
  dup: () => { if (!S.sel.length) return; snapshot(); const pg = page(); const ids = []; selEls().forEach(e => { const c = clone(e); c.id = 'e' + (++uid); c.name += ' copy'; c.x += 20; c.y += 20; pg.elements.push(c); ids.push(c.id); }); S.sel = ids; },
  del: () => { if (!S.sel.length) return; snapshot(); page().elements = page().elements.filter(e => !S.sel.includes(e.id)); S.sel = []; },
  front: () => reorder(1), back: () => reorder(-1),
  undo: () => { if (!S.undo.length) return; S.redo.push(JSON.stringify(S.project)); S.project = JSON.parse(S.undo.pop()); fixSel(); },
  redo: () => { if (!S.redo.length) return; S.undo.push(JSON.stringify(S.project)); S.project = JSON.parse(S.redo.pop()); fixSel(); },
  recipe: d => insertRecipe(+d.i),
  toast: d => toast(d.msg),
  gotoDiag: (d, n) => { const s = JSON.parse(n.dataset.sel); if (s.owner) { S.owner = 'project'; S.sel = []; } else { S.pageId = s.pageId; S.owner = null; S.sel = s.el ? [s.el] : []; } S.cTab = 'script'; },
  play: () => startPlay(),
  edit: () => stopPlay(),
  phone: d => { S.play.phone = d.v === '1'; },
  stopScripts: () => { S.play.sound = null; toast('■ All Scripts and timers stopped. Your authored Project is untouched.'); },
};
function fixSel() { if (!S.project.pages.find(p => p.id === S.pageId)) S.pageId = S.project.pages[0].id; const ids = page().elements.map(e => e.id); S.sel = S.sel.filter(i => ids.includes(i)); }
function reorder(dir) {
  if (!S.sel.length) return; snapshot(); const a = page().elements;
  const idxs = S.sel.map(id => a.findIndex(e => e.id === id)).sort((x, y) => dir > 0 ? y - x : x - y);
  idxs.forEach(i => { const j = i + dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; });
}
// Variant B: open an owner's Script in its own window, or bring an open one to the front.
let zTop = 30;
function openWin(key) {
  const w = S.bWins.find(x => x.key === key);
  if (w) { w.z = ++zTop; return; }
  const n = S.bWins.length;
  S.bWins.push({ key, x: Math.max(110, window.innerWidth - 404 - n * 28), y: Math.min(60 + n * 30, window.innerHeight - 420), z: ++zTop });
}
function insertRecipe(i, key) {
  const o = key ? ownerByKey(key) : scriptOwner(); const r = RECIPES[i];
  const other = S.project.pages.find(p => p.id !== page().id) || page();
  snapshot();
  o.obj.script = ((o.obj.script || '').trimEnd() + (o.obj.script ? '\n\n' : '') + `-- Recipe: ${r.name}\n` + r.src(other.name)).trimStart();
  toast(`Inserted “${r.name}” as ordinary NorthTalk — edit it freely.`);
}

// ===================================================================
// Play (simulated) — authored Project is cloned; returning to Edit discards the clone
// ===================================================================
function startPlay() {
  S.editing = null;
  S.play = { project: clone(S.project), pageId: S.pageId, clues: [], created: 0, changes: 0, sound: null, phone: false };
  onOpenPage();
}
function stopPlay() {
  const P = S.play; const n = P.changes + P.created;
  S.play = null; render();
  toast(n ? `Back to Edit — ${n} Play change${n === 1 ? '' : 's'} discarded; authored Project restored.` : 'Back to Edit.');
}
function goPage(id) {
  const P = S.play; const from = page();
  const stopped = P.sound ? ' and its audio' : '';
  P.sound = null; P.pageId = id; onOpenPage();
  toast(`Left “${from.name}” — its Scripts, timers${stopped} stopped. Visual changes kept.`);
}
function onOpenPage() {
  const P = S.play; const pg = page();
  if (pg.id === 'p3') { const v = pg.elements.find(e => e.name === 'verdict'); if (v) { v.html = `<p>At the bottom of the stairs: the keeper, asleep beside the torn page.</p><p>You found <b>${P.clues.length}</b> clue${P.clues.length === 1 ? '' : 's'}. The keeper wakes.</p>`; } }
}
function runButton(el) {
  const P = S.play; const a = el.action || {};
  if (a.type === 'go') return goPage(a.page);
  if (a.type === 'sound') { P.sound = a.file; toast('♪ Playing waves.mp3 (owned by this Page)'); return; }
  if (a.type === 'clue') {
    if (P.clues.includes(a.clue)) return;
    P.clues.push(a.clue);
    el.label = 'Logbook examined ✓'; el.fill = '#5b6472'; el.color = '#fff'; P.changes += 2;
    page().elements.push({ id: 'e' + (++uid), kind: 'button', name: 'trapdoor', label: 'Open the trapdoor ↓', x: 420, y: 860, w: 240, h: 52, fill: '#c8483b', color: '#fff', radius: 10, action: { type: 'go', page: 'p3' }, created: true });
    P.created++;
    toast('Clue remembered by the Project Script. The Page Script created a button.');
    return;
  }
}

// ===================================================================
// Events
// ===================================================================
document.addEventListener('click', e => {
  const sw = e.target.closest('[data-sw]'); if (sw) return cycle(+sw.dataset.sw);
  const fmt = e.target.closest('[data-fmt]'); if (fmt) { e.preventDefault(); return applyFmt(fmt.dataset.fmt); }
  const a = e.target.closest('[data-action]');
  if (a) { const fn = ACTIONS[a.dataset.action]; if (fn) { fn(a.dataset, a); render(); } return; }
  if (S.play) {
    const n = e.target.closest('[data-el]'); if (!n) return;
    const el = page().elements.find(x => x.id === n.dataset.el);
    if (el && el.kind === 'button') { runButton(el); render(); }
  }
});
document.addEventListener('mousedown', e => { if (e.target.closest('[data-fmt]')) e.preventDefault(); });

function applyFmt(cmd) {
  if (S.editing) { document.execCommand(cmd); return; }
  const el = selEls()[0]; if (!el || el.kind !== 'text') return;
  snapshot(); // whole-Element formatting when not editing inline
  const tag = { bold: 'b', italic: 'i', underline: 'u' }[cmd];
  el.html = el.html.replace(/<p>(.*?)<\/p>/g, `<p><${tag}>$1</${tag}></p>`); render();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-script]')) {
    const o = ownerByKey(t.dataset.script); o.obj.script = t.value;
    // update gutter + diagnostics without losing focus
    const ed = t.closest('.editor'); const d = checkScript(t.value);
    ed.querySelector('.gutter').innerHTML = Array.from({ length: Math.max(t.value.split('\n').length, 8) }, (_, i) => d && d.line === i + 1 ? `<span class="bad">${i + 1}</span>` : i + 1).join('\n');
    const dg = ed.parentElement.querySelector('.diag'); if (dg) dg.outerHTML = diagHTML(o);
    return;
  }
  if (t.matches('[data-fmtcolor]')) { if (S.editing) document.execCommand('foreColor', false, t.value); return; }
  if (t.closest('[data-el][contenteditable]')) {
    const el = page().elements.find(x => x.id === t.closest('[data-el]').dataset.el);
    if (S.play && el) { if (!el._dirty) { el._dirty = true; S.play.changes++; refreshPlayBar(); } }
    return;
  }
});
function refreshPlayBar() { const s = document.querySelector('.play-bar .state'); if (s) { const P = S.play; s.innerHTML = `Play State — clues <b>${P.clues.length}</b> · created <b>${P.created}</b> · changed <b>${P.changes}</b> · <i>temporary</i>`; } }
document.addEventListener('focusout', e => {
  const n = e.target.closest && e.target.closest('[data-el][contenteditable]'); if (!n) return;
  const el = page().elements.find(x => x.id === n.dataset.el); if (!el) return;
  const html = [...n.childNodes].filter(c => !(c.classList && (c.classList.contains('badge') || c.classList.contains('handle')))).map(c => c.outerHTML ?? esc(c.textContent)).join('');
  if (S.play) { el.html = html; return; }
  if (S.editing === el.id) { if (html !== el.html) { snapshot(); el.html = html; } S.editing = null; setTimeout(render, 0); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-recipe]') && t.value !== '') { insertRecipe(+t.value, t.dataset.recipe || undefined); render(); return; }
  if (t.matches('[data-prop]')) {
    const el = selEls()[0]; if (!el) return; snapshot();
    const k = t.dataset.prop; el[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? +t.value : t.value; render();
  }
  if (t.matches('[data-pageprop]')) { snapshot(); const k = t.dataset.pageprop; page()[k] = t.type === 'number' ? +t.value : t.value; render(); }
  if (t.matches('[data-script]')) render();
});
document.addEventListener('dblclick', e => {
  if (S.play) return;
  const n = e.target.closest('.page.edit [data-el]'); if (!n) return;
  const el = page().elements.find(x => x.id === n.dataset.el);
  if (!el) return;
  S.sel = [el.id];
  // HyperCard-style: double-click opens the Element's Script in its own window (Variant B).
  // Text keeps double-click for editing; Shift-double-click opens its Script instead.
  if (S.variant === 'B' && (el.kind !== 'text' || e.shiftKey)) { S.editing = null; openWin(`el:${el.id}`); render(); return; }
  if (el.kind === 'text') S.editing = el.id;
  else { S.aTab = 'script'; S.cTab = 'script'; }
  render();
});

// Drag to move / resize Elements, drag windoids (Variant B)
let drag = null;
document.addEventListener('pointerdown', e => {
  const bar = e.target.closest('.win .bar');
  const win = e.target.closest('.win');
  if (win && S.bWins.some(w => w.key === win.dataset.win)) { const w = S.bWins.find(x => x.key === win.dataset.win); w.z = ++zTop; win.style.zIndex = w.z; }
  if (bar && !e.target.closest('button')) { const w = bar.parentElement; drag = { win: w.dataset.win, sx: e.clientX, sy: e.clientY, ox: w.offsetLeft, oy: w.offsetTop, node: w }; return; }
  if (S.play) return;
  const pg = e.target.closest('.page.edit'); if (!pg) return;
  if (e.target.closest('[contenteditable="true"]')) return;
  const s = +pg.closest('.fit').dataset.cur || 1;
  const h = e.target.closest('[data-handle]');
  const n = e.target.closest('[data-el]');
  if (!n) { S.sel = []; S.owner = null; S.editing = null; render(); return; }
  const id = n.dataset.el;
  // HyperCard's ⌘⌥-click: open any Element's Script directly
  if (S.variant === 'B' && e.metaKey && e.altKey) { S.sel = [id]; openWin(`el:${id}`); render(); e.preventDefault(); return; }
  if (e.shiftKey) { S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : [...S.sel, id]; S.owner = null; render(); return; }
  if (!S.sel.includes(id)) { S.sel = [id]; S.owner = null; S.editing = null; render(); }
  const els = selEls();
  drag = { s, sx: e.clientX, sy: e.clientY, resize: !!h, moved: false, start: els.map(el => ({ el, x: el.x, y: el.y, w: el.w, h: el.h })) };
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.win) { const w = S.win[drag.win] || S.bWins.find(x => x.key === drag.win); w.x = drag.ox + e.clientX - drag.sx; w.y = Math.max(30, drag.oy + e.clientY - drag.sy); drag.node.style.left = w.x + 'px'; drag.node.style.top = w.y + 'px'; return; }
  const dx = (e.clientX - drag.sx) / drag.s, dy = (e.clientY - drag.sy) / drag.s;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 2) return;
  if (!drag.moved) { snapshot(); drag.moved = true; }
  for (const st of drag.start) {
    const n = document.querySelector(`.page.edit [data-el="${st.el.id}"]`);
    if (drag.resize) { st.el.w = Math.max(10, Math.round(st.w + dx)); st.el.h = Math.max(2, Math.round(st.h + dy)); if (n) { n.style.width = st.el.w + 'px'; n.style.height = st.el.h + 'px'; } }
    else { st.el.x = Math.round(st.x + dx); st.el.y = Math.round(st.y + dy); if (n) { n.style.left = st.el.x + 'px'; n.style.top = st.el.y + 'px'; } }
  }
});
document.addEventListener('pointerup', () => { if (drag && drag.moved) render(); drag = null; });

document.addEventListener('keydown', e => {
  const t = e.target; const typing = t.closest && (t.closest('input, textarea, select, [contenteditable="true"]'));
  if (e.key === 'Escape' && S.play) { ACTIONS.stopScripts(); render(); return; }
  if (typing) return;
  if (e.key === 'ArrowLeft') return cycle(-1);
  if (e.key === 'ArrowRight') return cycle(1);
  if (S.play) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === 'z') { e.preventDefault(); ACTIONS[e.shiftKey ? 'redo' : 'undo'](); render(); }
  else if (mod && e.key === 'd') { e.preventDefault(); ACTIONS.dup(); render(); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { ACTIONS.del(); render(); }
});
window.addEventListener('resize', () => { fitAll(); });

render();
</script>
</body>
</html>
