name: HTTP end to end

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/http/**'
      - 'impl/ts/src/**'
      - 'impl/go/**'
      - 'impl/zig/**'
      - 'tooling/cli/**'
      - 'tools/e2e/**'
      - '.github/workflows/e2e-http.yml'
  push:
    branches: [main]
    paths:
      - 'examples/http/**'
      - 'impl/ts/src/**'
      - 'impl/go/**'
      - 'impl/zig/**'
      - 'tooling/cli/**'
      - 'tools/e2e/**'
      - '.github/workflows/e2e-http.yml'

jobs:
  # Every northtalk runner (Bun, Node, Go, native Zig) serves the HTTP example.
  runners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: bun install --frozen-lockfile
      - run: bun run unicode:check
      - run: bun run build
        working-directory: tooling/cli
      - run: go -C impl/go build -o dist/northtalk ./cmd/northtalk
      - run: zig build
        working-directory: impl/zig
      - run: bun run e2e:http
