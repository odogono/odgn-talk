name: PR cross-Core replay

# Chapter 11's cross-Core replay: every save of each Trace Case restored on
# the TS Core and the Zig reactor. On Actions because it needs Zig.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'impl/ts/**'
      - 'impl/zig/**'
      - 'corpus/**'
      - 'spec/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/actions/setup-ts/**'
      - '.github/workflows/pr-cross-core.yml'
  push:
    branches: [main]
    paths:
      - 'impl/ts/**'
      - 'impl/zig/**'
      - 'corpus/**'
      - 'spec/**'

permissions:
  contents: read

concurrency:
  group: pr-cross-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: ./.github/actions/setup-ts
      - run: bun run wasm:build
      - run: bun run corpus:cross --quiet
