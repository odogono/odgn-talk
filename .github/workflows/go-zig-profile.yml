name: Go Zig guest profile

# Samples the Zig guest under wazero with perf (#1377). It runs on pushes
# to profile/** branches only; read the symbol tables, not the timings.
on:
  push:
    branches: ['profile/**']

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install perf
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -yq linux-tools-generic linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version
      # The embedded guest with its name section, so wazero's perf map
      # names guest functions. Codegen is unchanged.
      - name: Swap in an unstripped guest
        run: |
          (cd impl/zig && zig build -Dtarget=wasm32-wasi -Doptimize=safe -Dstrip=false)
          cp impl/zig/zig-out/bin/talk.wasm impl/go/internal/zigwasm/talk.wasm
          sum=$(sha256sum impl/go/internal/zigwasm/talk.wasm | cut -d' ' -f1)
          python3 - "$sum" <<'PY'
          import json, sys
          p = 'impl/go/internal/zigwasm/artifact.json'
          d = json.load(open(p)); d['sha256'] = sys.argv[1]
          json.dump(d, open(p, 'w'))
          PY
      - name: Build benchmark binaries
        run: |
          go -C bench/go test -c -o "$RUNNER_TEMP/native.test" .
          go -C bench/go test -c -tags 'talk_zig_experimental perfmap' -o "$RUNNER_TEMP/zig.test" .
      # The binaries read ../scripts/benchmarks.json, so run them from bench/go.
      - name: Profile Run/host/pump
        working-directory: bench/go
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          ln -s "$RUNNER_TEMP/results" results
          bench='-test.run=^$ -test.bench=^BenchmarkRun$/host/pump$ -test.benchmem -test.count=5'
          "$RUNNER_TEMP/native.test" $bench | tee results/native.txt
          "$RUNNER_TEMP/zig.test" $bench | tee results/zig.txt
          perf record -F 4999 -g -o results/zig.perf.data -- "$RUNNER_TEMP/zig.test" -test.run='^$' -test.bench='^BenchmarkRun$/host/pump$' -test.benchtime=20s > /dev/null
          cp /tmp/perf-*.map results/ || true
          perf report -i results/zig.perf.data --no-children --sort symbol --stdio --percent-limit 0.3 -g none > results/self.txt
          perf report -i results/zig.perf.data --no-children --sort dso --stdio > results/dso.txt
          # Every symbol, then guest basic blocks (name:::::L<n>) summed per function.
          perf report -i results/zig.perf.data --no-children --sort dso,symbol --stdio -g none --percent-limit 0 > results/all.txt
          awk '/%/ && match($0, /\[\.\] /) {p=$1; sub(/%/,"",p); k=substr($0, RSTART+4); sub(/:::::L[0-9]+.*/,"",k); sub(/[ \t]+-[ \t]+-[ \t]*$/,"",k); sub(/[ \t]+$/,"",k); t[k]+=p} END {for (k in t) printf "%7.3f%%  %s\n", t[k], k}' results/all.txt | sort -rn > results/functions.txt
          perf report -i results/zig.perf.data --children --sort symbol --stdio --percent-limit 2 -g caller,0.5,callee --max-stack 12 > results/callers.txt
          { uname -a; lscpu | head -20; perf --version; git -C "$GITHUB_WORKSPACE" rev-parse HEAD; } > results/env.txt
      - run: head -80 "$RUNNER_TEMP/results/functions.txt"; head -30 "$RUNNER_TEMP/results/dso.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: go-zig-profile-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/results/*.txt
            ${{ runner.temp }}/results/*.map
            ${{ runner.temp }}/results/zig.perf.data
