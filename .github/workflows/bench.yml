name: Benchmark Suite

# The smoke pass (#319): each Benchmark once at its smoke size, on every Core
# and Peer Language that runs on Linux, checking output and Fuel parity. It
# times nothing and saves nothing. Runs weekly or manually; AppleScript runs
# only on macOS.
on:
  workflow_dispatch:
  # Weekly rather than on every push to main, to save Actions minutes;
  # Woodpecker runs the Linux checks on main and nightly.
  schedule:
    - cron: '43 5 * * 0'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Installs the CPython pinned in bench/peers/python/.python-version.
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-ts
      - name: The Go modules are tidy
        run: |
          tools/go/tidy-check.sh bench/go bench/peers/go impl/go impl/go/sqlite
      - run: bun test tests
        working-directory: bench/ts
      - run: bun run bench --smoke
