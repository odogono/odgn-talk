name: Zig Core

on:
  pull_request:
    paths:
      - 'impl/zig/**'
      - 'spec/**'
      - 'corpus/**'
      - 'tools/zig/**'
      - 'tools/unicode/**'
      - 'tools/wasi/zig.py'
      - '.github/workflows/zig.yml'
  push:
    branches: [main]
    paths:
      - 'impl/zig/**'
      - 'spec/**'
      - 'corpus/**'
      - 'tools/zig/**'
      - 'tools/unicode/**'
      - 'tools/wasi/zig.py'
      - '.github/workflows/zig.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # The Unicode check formats the Go Core's table too, with gofmt.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Downloads and verifies the pinned UCD the conformance tests read, and
      # holds the Zig Core's generated tables to the Data Files.
      - run: bun run unicode:check
      - run: bun run zig:check
      - run: zig fmt --check impl/zig
      # Fails on a talk.h name talk.go doesn't declare, and lists the talk.go
      # names talk.h doesn't declare yet.
      - run: bun tools/zig/api.ts
      - run: zig build test --summary all
        working-directory: impl/zig
      - run: zig build
        working-directory: impl/zig
      - run: zig build -Dtarget=wasm32-wasi
        working-directory: impl/zig
      - run: zig build corpus -- --check-passing
        working-directory: impl/zig

  # Runs the wasm32-wasi build in wasmtime through talk.h, and holds its
  # memory per instance and payload to #532's thresholds (ADR 0078).
  wasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and check the WASI module
        timeout-minutes: 10
        run: |
          zig build -Dtarget=wasm32-wasi --prefix ../../.cache/zig-wasi
          python -m pip install wasmtime==49.0.0 brotli==1.2.0
          python ../../tools/wasi/zig.py ../../.cache/zig-wasi/bin/talk.wasm
        working-directory: impl/zig
