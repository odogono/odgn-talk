name: Zig Core

on:
  pull_request:
    paths:
      - 'impl/zig/**'
      - 'spec/**'
      - 'corpus/**'
      - 'tools/zig/**'
      - 'tools/unicode/**'
      - 'tools/wasi/zig.py'
      - 'tooling/fuzz/**'
      - '.github/workflows/zig.yml'
  push:
    branches: [main]
    paths:
      - 'impl/zig/**'
      - 'spec/**'
      - 'corpus/**'
      - 'tools/zig/**'
      - 'tools/unicode/**'
      - 'tools/wasi/zig.py'
      - 'tooling/fuzz/**'
      - '.github/workflows/zig.yml'

jobs:
  # The generated tables, formatting and talk.h's names. Only this job needs
  # Go and Bun.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # The Unicode check formats the Go Core's table too, with gofmt.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Downloads and verifies the pinned UCD the conformance tests read, and
      # holds the Zig Core's generated tables to the Data Files.
      - run: bun run unicode:check
      - run: bun run zig:check
      - run: zig fmt --check impl/zig
      # Fails on a talk.h name talk.go doesn't declare, or a talk.go name
      # talk.h doesn't.
      - run: bun tools/zig/api.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The conformance tests read the pinned UCD.
      - run: bun run unicode:fetch
      - run: zig build test --summary all
        working-directory: impl/zig

  # Builds the library and runs the whole Corpus in one invocation, so the
  # two compile in parallel. Any failing or unsupported case fails. The wasi
  # job builds wasm32-wasi.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build install corpus
        working-directory: impl/zig
      # Every lifecycle crossing that may defer does so once and resumes,
      # as under the Message Layer; no Trace may change (#900).
      - run: zig build corpus -- --defer-crossings
        working-directory: impl/zig

  # The fuzzer's witnesses and mutations give the TS Core's complete Traces
  # through the Zig fuzz worker. The nightly campaign fuzzes it further.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: ./.github/actions/setup-ts
      - run: bun test tests/zig-runner.test.ts
        working-directory: tooling/fuzz

  # Runs the wasm32-wasi build in wasmtime through talk.h, and holds its
  # memory per instance and payload to #532's thresholds (ADR 0078).
  wasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and check the WASI module
        timeout-minutes: 10
        run: |
          zig build -Dtarget=wasm32-wasi --prefix ../../.cache/zig-wasi
          python -m pip install wasmtime==49.0.0 brotli==1.2.0
          python ../../tools/wasi/zig.py ../../.cache/zig-wasi/bin/talk.wasm
        working-directory: impl/zig
