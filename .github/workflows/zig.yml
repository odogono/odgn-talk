name: Zig Core

on:
  pull_request:
    paths:
      - 'impl/zig/**'
      - 'spec/**'
      - '!spec/**/*.md'
      - 'corpus/**'
      - 'tools/zig/**'
      - 'tools/unicode/**'
      - 'tools/wasi/**'
      - 'tools/sidecar/**'
      - 'bench/message-layer/elixir/**'
      - 'impl/elixir/**'
      - 'tooling/fuzz/**'
      - '.github/workflows/zig.yml'
  push:
    branches: [main]
    paths:
      - 'impl/zig/**'
      - 'spec/**'
      - '!spec/**/*.md'
      - 'corpus/**'
      - 'tools/zig/**'
      - 'tools/unicode/**'
      - 'tools/wasi/**'
      - 'tools/sidecar/**'
      - 'bench/message-layer/elixir/**'
      - 'impl/elixir/**'
      - 'tooling/fuzz/**'
      - '.github/workflows/zig.yml'

jobs:
  # Build the CI targets, then execute on matching runners.
  # Cross-build evidence alone never establishes runtime compatibility.
  sidecar-cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, aarch64-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build sidecar -Dtarget=${{ matrix.target }}
        working-directory: impl/zig

  sidecar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: zig build sidecar
        working-directory: impl/zig
      - run: python tools/sidecar/check.py impl/zig/zig-out/bin/messagelayer
      - name: Check native process List memory and post-fault reuse
        run: |
          python -m pip install wasmtime==49.0.0 brotli==1.2.0
          python tools/wasi/list_memory.py --sidecar impl/zig/zig-out/bin/messagelayer

  # The Elixir embedding library, on its oldest and newest supported
  # Elixir/OTP, against the reactor built here. No Go is installed.
  elixir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { otp: '27', elixir: '1.17' }
          - { otp: '28', elixir: '1.19' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - run: zig build -Dtarget=wasm32-wasi --prefix ../../.cache/zig-wasi
        working-directory: impl/zig
      - run: mix deps.get
        working-directory: impl/elixir
      - run: mix format --check-formatted
        working-directory: impl/elixir
      - run: mix compile --warnings-as-errors
        working-directory: impl/elixir
      - run: mix test
        working-directory: impl/elixir
      - run: NORTH_TALK_CALLBACKS=fields mix test
        working-directory: impl/elixir

  # The OTP example as a consumer builds it: no Zig, Go or sidecar, and the
  # pinned reactor release fetched at compile time.
  elixir-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Zig save format against the Elixir pin
        run: impl/elixir/scripts/check-save-format.sh
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - run: mix deps.get
        working-directory: impl/elixir/examples/shop
      - run: mix format --check-formatted
        working-directory: impl/elixir/examples/shop
      - run: mix test
        working-directory: impl/elixir/examples/shop

  sidecar-elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - run: mix deps.get
        working-directory: bench/message-layer/elixir
      - run: mix run -e 'TalkHost.Artifacts.build!()'
        working-directory: bench/message-layer/elixir
      - run: mix test
        working-directory: bench/message-layer/elixir
      - name: Check Linux cgroup containment and post-fault reuse
        run: |
          mix run -e 'profiles = TalkHost.Containment.sidecar(3); results = %{"containment" => %{"sidecar" => profiles}}; verdicts = TalkHost.Report.verdicts(results, %{}); IO.inspect(profiles, limit: :infinity); if Enum.any?(verdicts, &(not &1["pass"])), do: System.halt(1)'
        working-directory: bench/message-layer/elixir

  # The generated tables, formatting and talk.h's names. Only this job needs
  # Go and Bun.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # The Unicode check formats the Go Core's table too, with gofmt.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Downloads and verifies the pinned UCD the conformance tests read, and
      # holds the Zig Core's generated tables to the Data Files.
      - run: bun run unicode:check
      - run: bun run zig:check
      - run: zig fmt --check impl/zig
      # Fails on a talk.h name talk.go doesn't declare, or a talk.go name
      # talk.h doesn't.
      - run: bun tools/zig/api.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The conformance tests read the pinned UCD.
      - run: bun run unicode:fetch
      - run: zig build test --summary all
        working-directory: impl/zig

  # Builds the library and runs the whole Corpus in one invocation, so the
  # two compile in parallel. Any failing or unsupported case fails. The wasi
  # job builds wasm32-wasi.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build install corpus
        working-directory: impl/zig
      # Every lifecycle crossing that may defer does so once and resumes,
      # as under the Message Layer; no Trace may change (#900).
      - run: zig build corpus -- --defer-crossings
        working-directory: impl/zig

  # The fuzzer's witnesses and mutations give the TS Core's complete Traces
  # through the Zig fuzz worker. The nightly campaign fuzzes it further.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upgrading Zig is its own PR (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: ./.github/actions/setup-ts
      - run: bun test tests/zig-runner.test.ts
        working-directory: tooling/fuzz

  # Runs the wasm32-wasi build in wasmtime through talk.h, and holds its
  # memory per instance and payload to #532's thresholds (ADR 0078).
  wasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and check the WASI module
        timeout-minutes: 10
        run: |
          zig build -Dtarget=wasm32-wasi --prefix ../../.cache/zig-wasi
          python -m pip install wasmtime==49.0.0 brotli==1.2.0
          python ../../tools/wasi/zig.py ../../.cache/zig-wasi/bin/talk.wasm
          python ../../tools/wasi/check.py ../../.cache/zig-wasi/bin/talk.wasm
        working-directory: impl/zig

  # One job per workload; exercise Limit Fault rollback and post-fault reuse
  # through the Message Layer at the conformance-minimum limits.
  wasi-memory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workload: [local, persistent]
        item: [text, nothing]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the WASI Message Layer reactor
        timeout-minutes: 10
        run: |
          zig build -Dtarget=wasm32-wasi --prefix ../../.cache/zig-wasi
          python -m pip install wasmtime==49.0.0 brotli==1.2.0
        working-directory: impl/zig
      - name: Check WASI List memory at conformance minimums
        timeout-minutes: 6
        run: python tools/wasi/list_memory.py --profile minimum --workload ${{ matrix.workload }} --item ${{ matrix.item }}
