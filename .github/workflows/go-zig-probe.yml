name: Go Zig callback probe

on:
  pull_request:
    paths:
      - 'spikes/go-zig-binding/**'
      - 'impl/go/**'
      - 'impl/zig/**'
      - 'spec/**'
      - '.github/workflows/go-zig-probe.yml'
  push:
    branches: [main]
    paths:
      - 'spikes/go-zig-binding/**'
      - 'impl/go/**'
      - 'impl/zig/**'
      - 'spec/**'
      - '.github/workflows/go-zig-probe.yml'

jobs:
  # The embedded artifact is checked in: ordinary consumers need only Go.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/go-zig-binding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - run: go test -v -count=1 ./...
        env:
          CGO_ENABLED: '0'
      # The race detector needs cgo; the embedding itself does not.
      - run: go test -race -count=1 ./...

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: go test -c -o probe.test .
        working-directory: spikes/go-zig-binding
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
