name: Go Zig binding spike

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'spikes/go-zig-binding/**'
      - 'impl/zig/**'
      - 'spec/**'
      - '!spec/**/*.md'
      - '.github/workflows/go-zig-probe.yml'

jobs:
  # The embedded artifact is checked in: ordinary consumers need only Go.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/go-zig-binding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - run: go test -v -count=1 ./...
        env:
          CGO_ENABLED: '0'
      # The race detector needs cgo; the embedding itself does not.
      - run: go test -race -count=1 ./...
