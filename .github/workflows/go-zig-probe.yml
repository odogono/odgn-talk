name: Go Zig callback probe

on:
  pull_request:
    paths:
      - 'spikes/go-zig-binding/**'
      - 'impl/go/**'
      - 'impl/zig/**'
      - 'spec/**'
      - '.github/workflows/go-zig-probe.yml'
  push:
    branches: [main]
    paths:
      - 'spikes/go-zig-binding/**'
      - 'impl/go/**'
      - 'impl/zig/**'
      - 'spec/**'
      - '.github/workflows/go-zig-probe.yml'

jobs:
  # The embedded artifact is checked in: ordinary consumers need only Go.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/go-zig-binding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - run: go test -v -count=1 ./...
        env:
          CGO_ENABLED: '0'
      # The race detector needs cgo; the embedding itself does not.
      - run: go test -race -count=1 ./...

  public-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      # The shared public Hosts also execute on the default native Core.
      - run: go -C impl/go test -run '^TestCapabilityBridge' -count=1 .
        env:
          CGO_ENABLED: '0'
      - run: go -C impl/go vet -tags talk_zig_experimental . ./internal/zigwasm
        env:
          CGO_ENABLED: '0'
      - run: impl/go/zig-experimental-check.sh -v
        env:
          CGO_ENABLED: '0'
      - run: impl/go/zig-experimental-check.sh -race

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: go test -c -o probe.test .
        working-directory: spikes/go-zig-binding
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - run: go test -c -tags talk_zig_experimental -o adapter.test .
        working-directory: impl/go
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
