name: Go Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'impl/go/**'
      - 'impl/zig/**'
      - 'impl/testdata/**'
      - 'tools/**'
      - 'spec/**'
      - '!spec/**/*.md'
      - 'corpus/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/go.yml'

# Independent jobs, so the check takes as long as its slowest part.
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Downloads and verifies the pinned UCD used by the conformance tests,
      # and holds both Cores' generated output to the Data Files.
      - run: bun run check
      - name: Check Go formatting
        working-directory: impl/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
        working-directory: impl/go
      # Includes the talk.go API check and the Unicode import-policy check.
      # Verbose output reports API names not implemented yet, as #132 requires.
      - run: go test -v ./...
        working-directory: impl/go
      # Skips the exhaustive single-goroutine replays, which the run above covers.
      - run: go test -race ./...
        working-directory: impl/go

  # The sqlite Host is its own module, so the core runs skip it.
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: go vet ./... && go test -v ./... && go test -race ./...
        working-directory: impl/go/sqlite

  public-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      # The shared public Hosts also execute on the retiring native Core.
      - run: go -C impl/go test -tags talk_native_go -run '^TestCapabilityBridge' -count=1 .
        env:
          CGO_ENABLED: '0'
      - run: go -C impl/go vet . ./internal/zigwasm
        env:
          CGO_ENABLED: '0'
      # Keep ordinary JSON coverage when the adapter defaults to fields.
      - run: impl/go/zig-experimental-check.sh -v
        env:
          CGO_ENABLED: '0'
          TALK_ZIG_REQUEST_PUMP: ''
      - run: impl/go/zig-experimental-check.sh -race
      # The same suites over the binary Request/Pump exchange (#1245).
      - run: impl/go/zig-experimental-check.sh
        env:
          CGO_ENABLED: '0'
          TALK_ZIG_REQUEST_PUMP: fields

  # Pure-Go builds of every target from one runner; the matrix above runs them.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: impl/go/cross-check.sh
