name: Go Core

on:
  pull_request:
    paths:
      - 'impl/go/**'
      - 'impl/testdata/**'
      - 'tools/**'
      - 'spec/**'
      - 'corpus/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/go.yml'
  push:
    branches: [main]
    paths:
      - 'impl/go/**'
      - 'impl/testdata/**'
      - 'tools/**'
      - 'spec/**'
      - 'corpus/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/go.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Downloads and verifies the pinned UCD used by the conformance tests,
      # and holds both Cores' generated output to the Data Files.
      - run: bun run check
      - name: Check Go formatting
        working-directory: impl/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
        working-directory: impl/go
      # Includes the talk.go API check and the Unicode import-policy check.
      # Verbose output reports API names not implemented yet, as #132 requires.
      - run: go test -v ./...
        working-directory: impl/go
      # Skips the exhaustive single-goroutine replays, which the run above covers.
      - run: go test -race ./...
        working-directory: impl/go
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and check the WASI Message Layer reactor
        timeout-minutes: 5
        run: |
          mkdir -p .cache
          GOOS=wasip1 GOARCH=wasm go -C impl/go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags='-s -w' -o ../../.cache/messagelayer.wasm ./cmd/messagelayer-wasi
          python -m pip install wasmtime==49.0.0 brotli==1.2.0
          python tools/wasi/check.py .cache/messagelayer.wasm
      # The sqlite Host is its own module, so the runs above skip it.
      - run: go vet ./... && go test -v ./... && go test -race ./...
        working-directory: impl/go/sqlite
      # Every case, in ordinary and save/restore replay; a failure names its
      # first divergence and the command that reproduces it.
      - name: Run the complete Corpus on the Go Core
        run: go run ./cmd/corpus --check-passing
        working-directory: impl/go
      # The TS workflow's deterministic dual-Core smoke, for changes to the Go Core.
      - run: go -C impl/go build -o "$PWD/.cache/fuzzworker" ./cmd/fuzzworker
      - run: bun run fuzz smoke --seed 1 --output fuzz-findings --go-runner .cache/fuzzworker
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-findings
          path: fuzz-findings
          if-no-files-found: ignore
