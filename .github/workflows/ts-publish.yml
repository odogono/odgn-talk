name: TS publish

# Publishes @northtalk/ts to npm with trusted publishing (OIDC, no stored
# token; provenance is automatic). Bump the Core version, merge, then push a
# matching `ts-v*` tag.
on:
  push:
    tags: ['ts-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - run: bunx playwright install --with-deps chromium-headless-shell
        working-directory: impl/ts
      - run: bun run build
        working-directory: impl/ts
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./impl/ts/dist/package.json').version")
          if [ "ts-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - run: bun run package:check
        working-directory: impl/ts
      # Publishing uses the current Node 24 toolchain after floor validation.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish ./impl/ts/dist --access public

  # Runs odogono/northtalk-ts-example against the version just published, from
  # the public registry, under Node and Bun. A failure marks the release broken.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: node, node: '24.10' }
          - { runtime: node, node: latest }
          - { runtime: bun, node: latest }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: odogono/northtalk-ts-example
      - id: version
        run: echo "version=${GITHUB_REF_NAME#ts-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      # The registry can take a while to serve a new version, and serves its
      # metadata minutes before its tarball, so wait for both.
      - name: Wait for the version on the registry
        run: |
          for i in $(seq 1 60); do
            tarball=$(npm view "@northtalk/ts@$VERSION" dist.tarball 2>/dev/null) &&
              [ -n "$tarball" ] && curl -sfI "$tarball" > /dev/null && exit 0
            sleep 10
          done
          echo "::error::@northtalk/ts@$VERSION is not on the registry"
          exit 1
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: matrix.runtime == 'node'
        run: |
          npm ci
          # Saving rewrites the example's range, which may not admit a new minor.
          npm install "@northtalk/ts@$VERSION"
          npm ls @northtalk/ts
          npm test
          npm run typecheck
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: matrix.runtime == 'bun'
        run: |
          bun install
          bun add "@northtalk/ts@$VERSION"
          bun pm ls | grep "@northtalk/ts@$VERSION"
          bun test
        env:
          VERSION: ${{ steps.version.outputs.version }}
