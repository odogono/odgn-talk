name: Playground

# Publish the Playground's static dist/ to GitHub Pages, rebuilt from each
# push to main. It serves at https://opendoorgonorth.com/odgn-talk/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a queued deploy, but never cancels a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: tooling/playground
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tooling/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
