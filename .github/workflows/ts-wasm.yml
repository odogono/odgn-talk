name: TS embedding API on the Zig reactor

# @northtalk/ts/wasm (ADR 0097): the TS embedding API over the Zig Core's
# wasm32-wasi reactor. A change to either side can break the other.
on:
  workflow_dispatch:
  # Weekly rather than on every push to main, to save Actions minutes;
  # Woodpecker runs the Linux checks on main and nightly.
  schedule:
    - cron: '23 5 * * 0'

jobs:
  facade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build -Dtarget=wasm32-wasi --prefix ../../.cache/zig-wasi
        working-directory: impl/zig
      - uses: ./.github/actions/setup-ts
      # Host parity in both callback layouts, plus real protocol-frame checks.
      - run: bun test tests/wasm.test.ts tests/callbacks-fields.test.ts tests/request-pump-binary.test.ts tests/combined.test.ts examples/core-switch
        working-directory: impl/ts
      # Every Trace Case in both replays, on Bun and Node, in both callback layouts.
      - run: bun test tests/wasm-runtimes.test.ts
        working-directory: impl/ts
      - run: bunx playwright install --with-deps chromium-headless-shell
        working-directory: impl/ts
      - run: bun tools/request-pump-browser.ts
        working-directory: impl/ts
