name: TS Core

on:
  workflow_dispatch:
  # Weekly rather than on every push to main, to save Actions minutes;
  # Woodpecker runs the Linux checks on main and nightly.
  schedule:
    - cron: '3 5 * * 0'

# Independent jobs, so the check takes as long as its slowest part.
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ts
      - run: bun test tests
        working-directory: impl/ts
      - run: bun run build
        working-directory: impl/ts

  # Every Folio browser suite, headless, each run in a fresh browser context.
  folio-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ts
      - run: bunx playwright install --with-deps chromium-headless-shell
        working-directory: tooling/creative
      - run: bun run test:browser
        working-directory: tooling/creative

  # The packed tarball, installed outside the workspace as npm consumers get it:
  # under Node 22 and Bun, unbundled in Chromium, and against TypeScript 5.9 and
  # the latest TypeScript.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ts
      - run: bunx playwright install --with-deps chromium-headless-shell
        working-directory: impl/ts
      - run: bun run build && bun run package:check
        working-directory: impl/ts

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ts
      # Every case, blessed or awaiting first review, in both replays.
      - name: Run the complete Corpus on the TS Core
        run: bun run corpus:run
        working-directory: impl/ts

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The fuzz tests build the Zig worker. Upgrading Zig is its own PR
      # (#625).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: ./.github/actions/setup-ts
      - run: bun test tests
        working-directory: tooling/fuzz
      # A fixed seed keeps this a deterministic gate; the nightly job explores new seeds.
      # The Zig worker makes it dual-Core.
      - run: zig build fuzzworker --prefix "$PWD/../../.cache/zig-fuzz"
        working-directory: impl/zig
      - run: bun run fuzz smoke --seed 1 --output fuzz-findings --zig-runner .cache/zig-fuzz/bin/talk-fuzzworker
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-findings
          path: fuzz-findings
          if-no-files-found: ignore

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ts
      - run: bun test tests
        working-directory: tooling/stack
      - run: bun run build
        working-directory: tooling/stack
      - run: bun run test:node
        working-directory: tooling/stack

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ts
      - run: bun run typecheck
      - run: bun run lints:check
      # Includes the real stdio LSP fixture workspace under Bun.
      - run: bun test tests
        working-directory: tooling/cli
      # Runs the same stdio LSP workspace under Node.
      - run: bun run build && bun run test:node
        working-directory: tooling/cli
      # The shared browser editor, and the creative tool's build.
      - run: bun test tests
        working-directory: tooling/editor
      - run: bun test tests
        working-directory: tooling/creative
      # The editor extension's grammar tests, and its bundled client and server.
      - run: bun test tests && bun run build
        working-directory: tooling/vscode
      # The sqlite implementation is node:sqlite, so it must also pass the sqlite
      # kit under Node. setAuthorizer needs Node 24.10 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun test tests/sqlite-runtimes.test.ts
        working-directory: impl/ts
        env:
          NORTHTALK_SQLITE_RUNTIMES: node
      # The notification router must pass the router kit under Node too.
      - run: bun test tests/notify-runtimes.test.ts
        working-directory: impl/ts
        env:
          NORTHTALK_NOTIFY_RUNTIMES: node
      # The HTTP router is node:http, so it must pass the http kit under Node too.
      - run: bun test tests/http-runtimes.test.ts
        working-directory: impl/ts
        env:
          NORTHTALK_HTTP_RUNTIMES: node
