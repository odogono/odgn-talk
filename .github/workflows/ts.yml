name: TS Core

on:
  pull_request:
    paths:
      - 'impl/ts/**'
      - 'tooling/**'
      - 'tools/**'
      - 'spec/**'
      - 'corpus/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/ts.yml'
  push:
    branches: [main]
    paths:
      - 'impl/ts/**'
      - 'tooling/**'
      - 'tools/**'
      - 'spec/**'
      - 'corpus/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/ts.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The Unicode tests read the pinned source files this check downloads.
      - run: bun run unicode:check
      - run: bun test tests
        working-directory: impl/ts
      - run: bun run corpus:run
        working-directory: impl/ts
      - run: bun test tests
        working-directory: tooling/cli
      - run: bun run lints:check
      - run: bun test tests
        working-directory: tooling/stack
      - run: bun run build
        working-directory: tooling/stack
      - run: bun run test:node
        working-directory: tooling/stack
      - run: bun run build && bun run test:node
        working-directory: tooling/cli
      - run: bun run build
        working-directory: impl/ts
