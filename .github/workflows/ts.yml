name: TS Core

on:
  pull_request:
    paths:
      - 'impl/ts/**'
      - 'impl/testdata/**'
      - 'tooling/**'
      - 'tools/**'
      - 'spec/**'
      - 'corpus/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/ts.yml'
  push:
    branches: [main]
    paths:
      - 'impl/ts/**'
      - 'impl/testdata/**'
      - 'tooling/**'
      - 'tools/**'
      - 'spec/**'
      - 'corpus/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/ts.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The Unicode tests read the pinned source files this check downloads.
      - run: bun run unicode:check
      - run: bun test tests
        working-directory: impl/ts
      # Every case, blessed or awaiting first review, in both replays.
      - name: Run the complete Corpus on the TS Core
        run: bun run corpus:run
        working-directory: impl/ts
      - run: bun test tests
        working-directory: tooling/fuzz
      # A fixed seed keeps this a deterministic gate; the nightly job explores new seeds.
      # The Go worker makes it dual-Core; the Go workflow runs the same smoke for Go changes.
      - run: go -C impl/go build -o "$PWD/.cache/fuzzworker" ./cmd/fuzzworker
      - run: bun run fuzz smoke --seed 1 --output fuzz-findings --go-runner .cache/fuzzworker
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-findings
          path: fuzz-findings
          if-no-files-found: ignore
      # Includes the real stdio LSP fixture workspace under Bun.
      - run: bun test tests
        working-directory: tooling/cli
      - run: bun run lints:check
      - run: bun test tests
        working-directory: tooling/stack
      - run: bun run build
        working-directory: tooling/stack
      - run: bun run test:node
        working-directory: tooling/stack
      # Runs the same stdio LSP workspace under Node.
      - run: bun run build && bun run test:node
        working-directory: tooling/cli
      # The editor extension's grammar tests, and its bundled client and server.
      - run: bun test tests && bun run build
        working-directory: tooling/vscode
      - run: bun run build
        working-directory: impl/ts
      # The sqlite implementation is node:sqlite, so it must also pass the sqlite
      # kit under Node and Deno. setAuthorizer needs Node 24.10 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun test tests/sqlite-runtimes.test.ts
        working-directory: impl/ts
        env:
          NORTHTALK_SQLITE_RUNTIMES: node,deno
