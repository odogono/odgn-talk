name: Editor publish

# Publishes @northtalk/editor to npm with trusted publishing (OIDC, no stored
# token; provenance is automatic). Bump `version` in tooling/editor/package.json,
# merge, then push a matching `editor-v*` tag.
on:
  push:
    tags: ['editor-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - run: bunx playwright install --with-deps chromium-headless-shell
        working-directory: tooling/editor
      # The tarball check installs the editor beside this @northtalk/ts.
      - run: bun run build
        working-directory: impl/ts
      - run: bun run build
        working-directory: tooling/editor
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./tooling/editor/dist/package.json').version")
          if [ "editor-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - run: bun run package:check
        working-directory: tooling/editor
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish ./tooling/editor/dist --access public
