# The pinned Unicode version, and the Unicode Character Database files used.
#
# Each Core generates its segmentation, NFC, case-folding and class tables from
# these files at build time. A file whose hash doesn't match fails the build.
# Upgrading Unicode is a language version bump (ADR 0011).
#
# Schema: schema/unicode.schema.json. Shown in chapter 1 (region `unicode`).
#
#   version   the Unicode version, e.g. "16.0.0"
#   [[file]]
#     path    the file's path in the UCD, under https://www.unicode.org/Public/<version>/ucd/
#     sha256  the file's SHA-256 hash, as lowercase hex
#     use     what the Cores take from it

version = "18.0.0"

