# The Host error catalogue: every code a HostError can carry.
#
# Host misuse is refused at the call that made it, as a HostError with one of
# these codes. Parity covers the code, not the detail text. None of these codes
# is ever raised inside a Script (errors.toml holds those).
#
# Schema: schema/host-errors.schema.json. Shown in chapter 9 (region
# `host-errors`). Owned by the chapter 9 task.
#
# [[error]]
#   code         the code, lowercase words separated by spaces
#   raised_when  one sentence: the misuse that raises it

[[error]]
code = "clock backwards"
raised_when = "A Pump, or the first Pump after a restore, reads a Clock earlier than the last one"

[[error]]
code = "parent cycle"
raised_when = "`setParent` would make a cycle"

[[error]]
code = "duplicate object id"
raised_when = "A Host Object id is reused within its kind in one Group"

[[error]]
code = "name reused"
raised_when = "extend Script reuses a name, or a Library name is added twice"

[[error]]
code = "reentrant call"
raised_when = "A worker call is made from inside the Group's own Pump or a scope/Segment lifecycle callback"

[[error]]
code = "wrong group"
raised_when = "A Function Value or Host Object is passed into a Group it doesn't belong to"

[[error]]
code = "library mismatch"
raised_when = "A Library's imports aren't in the Group, or have different identities there"

[[error]]
code = "reserved name"
raised_when = "A Host registers a Library under a stdlib name"

[[error]]
code = "not adoptable"
raised_when = "A TS `run` call is settled by adopt after a restore"

[[error]]
code = "invalid value"
raised_when = "Input the value model can't hold (ADR 0030), a malformed declaration, a message name with a `:` that isn't a Selector with one argument per part (ADR 0055), or a limit override that loosens"

[[error]]
code = "invalid save"
raised_when = "`Restore` is given bytes this Core can't read: another Core family's save, a save format it no longer reads, or corrupt bytes"

[[error]]
code = "save mismatch"
raised_when = "A save's versions, Libraries or Grants don't match, and the Host's policy is to reject"

[[error]]
code = "unknown call"
raised_when = "`Settle` names a call id that isn't pending or one already settled, or is made once the first Pump has started"

[[error]]
code = "state too large"
raised_when = "The state an extension adds, or the Script Variables a Reload or a variables-only restore carries over, would exceed the Persistent State cap"

[[error]]
code = "effects pending"
raised_when = "Save is attempted while a Capability Scope or Segment participant is live, or after fatal effect uncertainty stopped the Group"

[[error]]
code = "effect state unknown"
raised_when = "Load, Reload, Extend or ReplaceLibrary attempts to change a Group stopped by fatal effect uncertainty"
