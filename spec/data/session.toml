# The Session Commands: the `:`-prefixed instructions to a REPL or Playground
# session itself (ADR 0014). They aren't part of the language, and no Script
# can issue one. A Session Transcript records each one, so both REPLs must
# accept the same commands and print the same output (chapter 12).
#
# Schema: schema/session.schema.json. Shown in chapter 12 (region
# `session.commands`).
#
# [[command]]
#   name         the command, with its `:`
#   usage        how it is written; [ … ] marks an optional part, and | a choice
#   does         one sentence: what it does
#   before       true if it is allowed only before the session starts
#   recorded     false if a Session Transcript leaves it out

[[command]]
name = ":grant"
usage = ":grant <name> <capability> [<binding>]"
does = "Grants the session a Capability the REPL or Playground Host has built in, or a mock one, under `<name>`, with a `calendar` Grant's default zone, a `locale` Grant's default tag or a `store` Grant's Store name as `<binding>`"
before = true

[[command]]
name = ":mock"
usage = ":mock <capability>.<operation> <mode>"
does = "Defines a mock Operation, with up to eight arguments and any result, costing nothing, and grants its Capability under its own name; `<mode>` is `immediate`, `suspending` or `fire-and-forget`"
before = true

[[command]]
name = ":stub"
usage = ":stub <capability>.<operation> <value> | :stub <capability>.<operation> fail <error>"
does = "Queues the result of the next call of a mock immediate Operation, or an error map to fail it with"

[[command]]
name = ":answer"
usage = ":answer <call> <value>"
does = "Answers a pending call of a mock suspending Operation"

[[command]]
name = ":fail"
usage = ":fail <call> <error>"
does = "Fails a pending call of a mock suspending Operation with an error map"

[[command]]
name = ":clock"
usage = ":clock [real | virtual [<instant>] | advance <duration>]"
does = "Shows the Clock, switches it between real and virtual, or advances a virtual Clock by an exact duration and pumps"

[[command]]
name = ":limits"
usage = ":limits [<limit> <value> | reset]"
does = "Shows the limits later Entries run with, tightens one of the limits a Delivery may override, or clears every override"

[[command]]
name = ":cancel"
usage = ":cancel [<run>]"
does = "Cancels a Run, by default the latest Entry's Run if it hasn't ended"

[[command]]
name = ":fix"
usage = ":fix <run> <path>"
does = "Fix and Continue: rewinds a Run that hasn't passed a Suspension Point and reloads the session with the file's declarations in place, keeping the mailbox, so the Run's message runs again on the new code"

[[command]]
name = ":runs"
usage = ":runs"
does = "Lists every Run that hasn't ended"

[[command]]
name = ":mailbox"
usage = ":mailbox"
does = "Lists every message waiting in the Session Script's mailbox"

[[command]]
name = ":vars"
usage = ":vars"
does = "Lists the Session Script's Script Variables and their values"

[[command]]
name = ":save"
usage = ":save [<name>]"
does = "Saves the session under `<name>`, or `default`, in the Host's memory"

[[command]]
name = ":restore"
usage = ":restore [<name>]"
does = "Restores the session saved under `<name>`, or `default`"

[[command]]
name = ":library"
usage = ":library add <name> <path> | :library replace <name> <path>"
does = "Adds a user Library from a file, or replaces one, carrying Script Variables over"

[[command]]
name = ":store"
usage = ":store [<store>] | :store load <path> [<store>] | :store save <path> [<store>] | :store clear [<store>]"
does = "Shows a Session Store's contents, by default the `default` Store, loads them from a file, saves them to one, or empties the Store"

[[command]]
name = ":export"
usage = ":export [<directory>]"
does = "Shows the Session Script's source, or writes it and each user Library to a directory as `.talk` files"

[[command]]
name = ":describe"
usage = ":describe <target>"
does = "Shows a named declaration and its documentation without executing it"

[[command]]
name = ":inspect"
usage = ":inspect <expression>"
does = "Evaluates once and describes the result, reading Host Object properties in a second ordinary Run"

[[command]]
name = ":apropos"
usage = ":apropos [query]"
does = "Lists matching available names and Library exports with their origins, describe targets and documentation"

[[command]]
name = ":trace"
usage = ":trace [selector]"
does = "Lists trace filters or adds a full Selector across the Group for future dispatched Runs"

[[command]]
name = ":untrace"
usage = ":untrace [selector]"
does = "Removes one trace filter or clears all; already traced Runs retain their terminal output"

[[command]]
name = ":fuel"
usage = ":fuel [entry]"
does = "Lists exact Fuel Measurements or measures an executable Entry and its spawned descendants"

[[command]]
name = ":help"
usage = ":help [<command>]"
does = "Shows help"
recorded = false

[[command]]
name = ":quit"
usage = ":quit"
does = "Ends the session"
recorded = false
