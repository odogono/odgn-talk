is = "its position"

[[record]]
name = "counters"
input = false
ids = ["script"]
is = "a snapshot of the Script's lifetime work and current state (chapter 9)"

[[record.key]]
key = "fuel"
type = "count"
is = "FuelTotal, including live Runs"

[[record.key]]
key = "alloc"
type = "count"
is = "AllocTotal, including live Runs"

[[record.key]]
key = "runs"
type = "count"
is = "Runs started since load"

[[record.key]]
key = "faults"
type = "count"
is = "Runs ended with a Limit Fault"

[[record.key]]
key = "state"
type = "count"
is = "current Persistent State, in bytes"

[[record.key]]
key = "mailbox"
type = "count"
is = "messages currently in the mailbox, excluding Runs and undrained Host Inputs"

[[record]]
name = "vars"
input = false
ids = ["script"]
is = "a Script's Script Variables, each as `<name>=<value>`, in declaration order"

[[record]]
name = "pumped"
input = false
ids = []
is = "the end of a Pump"

[[record.key]]
key = "state"
type = "word"
words = ["idle", "sliced", "stopped"]
is = "the Group's state"

[[record.key]]
key = "fuel"
type = "count"
is = "the Fuel the Pump used"

[[record.key]]
key = "next"
type = "instant"
optional = true
is = "the next deadline: the earliest timer the next Pump could fire, a `maxPending` or `MaxWait` included, if there is one"

[[record]]
name = "refused"
input = false
ids = []
is = "the Host Input before it was refused at the call, and changed nothing"

[[record.key]]
key = "code"
type = "value"
is = "the Host error's code, or `\"mailbox full\"`, as text"

[[end]]
word = "return"
is = "the Run completed: it reached `return` or the end of its body"

[[end]]
word = "pass"
is = "the Run completed with `pass`"

[[end]]
word = "veto"
is = "the Run completed with `veto`"

[[end]]
word = "error"
is = "the Run ended with an uncaught error"

[[end]]
word = "fault"
is = "the Run had a Limit Fault"

[[end]]
word = "cancel"
is = "the Run was cancelled"

[[end]]
word = "stop"
is = "the Run was discarded by Stop Script, a Reload or disposing its Script's owner, in the middle of this Stretch; a Run discarded while suspended, parked or preempted has no Stretch to end, and only the `stopped` record lists it"

[[end]]
word = "unhandled"
is = "no Handler Clause matched"

[[end]]
word = "dropped"
is = "a `, dropping` clause dropped the Run"

[[end]]
word = "park"
is = "a `, queued` clause parked the Run"

[[end]]
word = "ask-wait"
is = "the Run suspended at a suspending Operation call"

[[end]]
word = "send-wait"
is = "the Run suspended at `send … and wait`"

[[end]]
word = "send-up-wait"
is = "the Run suspended at a Command Call sent up the Message Path with `and wait`"

[[end]]
word = "call-value-wait"
is = "the Run suspended at a call to a Function Value in another Script"

[[end]]
word = "wait"
is = "the Run suspended at `wait`"

[[end]]
word = "wait-for"
is = "the Run suspended at `wait for`"

[[end]]
word = "wait-for-any"
is = "the Run suspended at a block `wait for`"

[[end]]
word = "join-end"
is = "the Run suspended at a Join's closing `end`"

[[note]]
word = "late-answer"
is = "an answer or failure arrived for a call that was abandoned, or whose Run has ended, and was ignored; the subject is the call"

[[note]]
word = "no-verdict"
is = "a Run that holds no open Verdict reached `veto`; the subject is the Run"

[[note]]
word = "climb-full"
is = "a message climbing its Message Path found the next mailbox full, and is reported as `unhandled`; the subject is the Run that passed it or ended `unhandled`"

[[note]]
word = "error-dropped"
is = "an `error` message found its Script's mailbox full, and was dropped; the subject is the Run that errored"

[[note]]
word = "function-gone"
is = "a Host call named a stale Function Value, and nothing ran; the subject is the Delivery"

[[setup]]
table = ""
key = "kind"
is = "the case kind: `trace`, `disassembly`, `transcript` or `encoding`"
kinds = ["trace", "disassembly", "transcript", "encoding"]

[[setup]]
table = "versions"
key = "language"
is = "the language version the case is blessed for"
kinds = ["trace", "disassembly", "transcript", "encoding"]

[[setup]]
table = "versions"
key = "costModel"
is = "the Cost Model version the case is blessed for"
kinds = ["trace", "disassembly", "transcript", "encoding"]

[[setup]]
table = "operations"
key = "capability"
is = "the Capability the Operation Declaration belongs to"
kinds = ["trace", "disassembly"]

[[setup]]
table = "operations"
key = "name"
is = "the Operation's name"
kinds = ["trace", "disassembly"]

[[setup]]
table = "operations"
key = "mode"
is = "`immediate`, `suspending` or `fire-and-forget`"
kinds = ["trace", "disassembly"]

[[setup]]
table = "operations"
key = "args"
is = "the argument Shapes, a list"
kinds = ["trace", "disassembly"]

[[setup]]
table = "operations"
key = "result"
is = "the result Shape; absent for a fire-and-forget Operation"
kinds = ["trace", "disassembly"]

[[setup]]
table = "operations"
key = "cost"
is = "the declared cost, `{fuel, alloc}`, each 0 if absent"
kinds = ["trace", "disassembly"]

[[setup]]
table = "operations"
key = "maxPending"
is = "for a suspending Operation, its `maxPending` in whole milliseconds; absent means the Script's `MaxWait`"
kinds = ["trace"]

[[setup]]
table = "operations"
key = "errors"
is = "the declared error codes, each `{code, fields}`, where `fields` are `{key, shape, optional}`"
kinds = ["trace", "disassembly"]

[[setup]]
table = "standard"
key = "capability"
is = "a Standard Capability the case uses"
kinds = ["trace", "disassembly"]

[[setup]]
table = "standard"
key = "costs"
is = "the cost of each of its Operations, a table from Operation name to `{fuel, alloc}`"
kinds = ["trace", "disassembly"]

[[setup]]
table = "objectKinds"
key = "name"
is = "an Object Kind's name"
kinds = ["trace", "encoding"]

[[setup]]
table = "objectKinds"
key = "parentKinds"
is = "the kinds its objects' parents may have"
kinds = ["trace", "encoding"]

[[setup]]
table = "objectKinds"
key = "props"
is = "its properties, each `{name, shape, readOnly, getCost, setCost}`"
kinds = ["trace"]

[[setup]]
table = "objects"
key = "kind"
is = "a Host Object's kind"
kinds = ["trace", "encoding"]

[[setup]]
table = "objects"
key = "id"
is = "its stable id"
kinds = ["trace", "encoding"]

[[setup]]
table = "objects"
key = "props"
is = "the values its properties start with, a table from property name to a value in the display form, as text"
kinds = ["trace"]

[[setup]]
table = "libraries"
key = "name"
is = "a user Library's name"
kinds = ["trace", "disassembly"]

[[setup]]
table = "libraries"
key = "version"
is = "its version, as text"
kinds = ["trace", "disassembly"]

[[setup]]
table = "libraries"
key = "source"
is = "the file that holds its source"
kinds = ["trace", "disassembly"]

[[setup]]
table = "scripts"
key = "name"
is = "a Script's name"
kinds = ["trace", "disassembly"]

[[setup]]
table = "scripts"
key = "source"
is = "the file that holds its source"
kinds = ["trace", "disassembly"]

[[setup]]
table = "scripts"
key = "grants"
is = "its Grants: a table from each granted name to `{capability, ops, binding}`, where `ops` is a list of Operation names or `\"all\"`, and `capability` may be left out when it is the granted name; optional `binding` is Host text for the Grant (Locale defaults to `und`, and other Capabilities to no binding)"
kinds = ["trace", "disassembly"]

[[setup]]
table = "scripts"
key = "grantsAsUsed"
is = "`true` to keep only the granted Operations the Script uses"
kinds = ["trace"]

[[setup]]
table = "scripts"
key = "owner"
