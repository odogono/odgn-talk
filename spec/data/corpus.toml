ids = ["library"]
is = "adds the Library that case.toml names"

[[record.key]]
key = "identity"
type = "hex"
filled = true
is = "the Library's code identity"

[[record]]
name = "replace-library"
input = true
ids = ["library"]
is = "replaces the Library with the source given"

[[record.key]]
key = "carry"
type = "word"
