[[record.key]]
key = "args"
type = "value"
optional = true
is = "its arguments, a list"

[[record.key]]
key = "limits"
type = "value"
optional = true
is = "its limit override, a map from each limit's `ts` name to its value"

[[record]]
name = "broadcast"
