[[record.key]]
key = "pc"
type = "count"
optional = true
is = "for one that landed early, the instruction it landed before"

[[record]]
name = "stop"
input = true
ids = ["script"]
is = "stops a Script"

[[record.key]]
key = "reason"
type = "value"
is = "the Host's reason, as text"

[[record.key]]
key = "pc"
