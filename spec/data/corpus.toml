# The Conformance Corpus's formats: the Trace's records, and the keys of a
# case's case.toml.
#
# A Trace is one record per line (chapter 11). A Host Input line starts with
# `> `, and a Core output line has no prefix. Each record is its name, its ids
# in order, then its keys in the order listed here, each as key=value. A key
# that isn't optional is always written; an optional one only when it applies.
# The language version pins this file (ADR 0018).
#
# Schema: schema/corpus.schema.json. Shown in chapter 11 (regions `corpus.*`).
#
# [type]         each key type: what its value is written as
#
# [[record]]     one Trace record
#   name         its name
#   input        true for a Host Input, written after `> `
#   ids          its ids, in order; a trailing ? marks one that may be absent
#   is           one sentence: what the record says
#   [[record.key]]
#     key        the key
#     type       one of [type]
#     optional   true if it is written only when it applies
#     filled     true if an author may leave it out of a Host Input line, and
#                bless fills it in
#     words      for type word: the words it may be
#     is         one sentence: what its value is
#
# [[end]]        a `seg` end reason: the word, and when a Segment ends so
# [[note]]       a `note` kind: the word, and when the Core notes it
#
# [[setup]]      one key of case.toml
#   table        the table it is in, or "" for a top-level key
#   key          the key
#   is           one sentence: what it holds
#   kinds        the case kinds that use it

[type]
id = "an id, such as `d4`, `orders/r2` or `orders/r2.c1` ([Ids](#ids))"
ids = "a list of ids, `[orders/r2, orders/r3]`"
word = "one of the words the key lists"
count = "a non-negative integer, in canonical text"
value = "a value, in the display form"
instant = "an Instant, in the display form"
target = "a Script's name, or a Host Object in the display form"
at = "a code position: a code unit's name, `:`, and an instruction index, `orders:17`"
pos = "a source position: a line, `:`, and a column, `22:5`"
hex = "lowercase hexadecimal"

[[record]]
name = "load"
input = true
ids = ["script"]
is = "loads the Script that case.toml names, with its source, Grants, owner, well-known objects and limits"

[[record.key]]
key = "identity"
type = "hex"
filled = true
is = "the Script's code identity"

[[record]]
name = "reload"
input = true
ids = ["script"]
is = "reloads the Script from the source given"

[[record.key]]
key = "carry"
type = "word"
words = ["yes", "no"]
is = "whether Script Variables carry over"

[[record.key]]
key = "source"
type = "value"
is = "the new source, as text"

[[record.key]]
key = "identity"
type = "hex"
filled = true
is = "the new source's code identity"

[[record]]
name = "extend"
input = true
