# Logical sizes
# ---------------------------------------------------------------------------

[[size]]
of = "nothing"
size = "8"

[[size]]
of = "boolean"
size = "8"

[[size]]
of = "number"
size = "16"

[[size]]
of = "quantity"
size = "24"

[[size]]
of = "text"
size = "16 + utf8(v)"

[[size]]
of = "bytes"
size = "16 + bytes(v)"

[[size]]
of = "list"
size = "16 + 8 * items(v) + contents(v)"

[[size]]
of = "map"
size = "16 + 8 * entries(v) + contents(v)"

[[size]]
of = "range"
size = "16 + contents(v)"

[[size]]
of = "instant"
size = "16"

[[size]]
of = "civil date"
size = "16"

[[size]]
of = "pattern"
size = "16 + 8 * program(v)"

[[size]]
of = "function"
size = "32 + 8 * items(v) + contents(v)"

[[size]]
of = "object"
size = "16"

[[size]]
of = "iterator"
size = "24 + size(v)"

[[size]]
of = "replacement"
size = "32 + contents(v)"

[[size]]
of = "reader"
size = "24 + size(v)"

[[size]]
of = "deadline"
size = "40"

[[size]]
of = "frame"
size = "64 + 8 * items(v) + contents(v)"

[[size]]
of = "run"
size = "96 + contents(v)"

[[size]]
of = "message"
size = "32 + contents(v)"

[[size]]
