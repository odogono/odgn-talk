size = "48"

# ---------------------------------------------------------------------------
# Rates
# ---------------------------------------------------------------------------

[[size]]
of = "dispatch context"
size = "96 + 8 * items(v) + contents(v)"

[[size]]
of = "dispatch activation"
size = "48 + contents(v)"

[[rate]]
key = "const"
fuel = "1"

[[rate]]
key = "stack"
fuel = "1"

[[rate]]
key = "slot"
fuel = "1"

[[rate]]
key = "store-var"
fuel = "2"

[[rate]]
key = "jump"
fuel = "1"

[[rate]]
key = "branch"
fuel = "1"

[[rate]]
key = "operator"
fuel = "2"
alloc = "size(result)"

[[rate]]
key = "arithmetic"
fuel = "3 + digits(result) / 8"
alloc = "size(result)"

[[rate]]
key = "power"
fuel = "8 + 2 * digits(result)"
alloc = "size(result)"

[[rate]]
key = "concat"
fuel = "3 + scalars(result) / 16"
alloc = "size(result)"

[[rate]]
key = "compare"
fuel = "2 + scanned / 16"
input = "the two operands; `scanned` is the pairs compared in order, through the first that differs or to the end of the shorter: Characters of text (their simple case foldings under `ignoring case`), bytes of Bytes, items of a list, or entries of a map in the left operand's order; 0 for any other kind, and between two kinds"

[[rate]]
key = "member"
fuel = "2 + scanned"
input = "the list or range; `scanned` is the items compared, through the first equal one, or 2 for a range"

[[rate]]
key = "convert"
fuel = "4 + scalars(input) / 8 + scalars(result) / 8"
alloc = "size(result)"
input = "the value converted"

[[rate]]
key = "search"
fuel = "4 + steps"
input = "the text searched"

[[rate]]
key = "get-key"
fuel = "3"
input = "the map or Host Object; a Host Object's property also charges the value's conversion, as a Capability result does"

[[rate]]
key = "property"
fuel = "3 + scalars(input) / 8 + items(result)"
alloc = "size(result)"
input = "the value whose property is read"

[[rate]]
key = "chunk-get"
fuel = "3 + scanned / 8"
alloc = "size(result)"
input = "the value read; `scanned` is the Characters or items from its start to the end of the chunk, code points for a `code point` chunk, and all of them when the chunk isn't there; `test-chunk` measures as a read of the chunk it tests"

[[rate]]
key = "chunk-set"
fuel = "4 + scalars(result) / 8 + items(result) / 8"
alloc = "size(input)"
input = "the new part; the Fuel counts the whole rebuilt value, and the allocation only the new part (ADR 0010)"

[[rate]]
key = "set-key"
fuel = "4 + entries(result) / 16"
alloc = "8 + size(input)"
input = "the new value"

[[rate]]
key = "append"
fuel = "3 + scalars(result) / 16"
alloc = "8 + size(input)"
input = "the value appended"

[[rate]]
key = "set-property"
fuel = "10 + size(input) / 32"
input = "the value set"

[[rate]]
key = "list"
fuel = "2 + count + items(result) / 16"
alloc = "size(result)"

[[rate]]
key = "map"
fuel = "2 + 2 * count"
alloc = "size(result)"

[[rate]]
key = "make-pattern"
fuel = "20 + 2 * program(result)"
alloc = "size(result)"

[[rate]]
key = "bytes-field"
fuel = "3 + bytes(input) / 8"
alloc = "size(result)"
input = "the field's value"

[[rate]]
key = "match"
fuel = "6 + steps"
alloc = "size(result)"
input = "the text matched"

[[rate]]
key = "iterate"
fuel = "2"
alloc = "24"
input = "an iterator shares its list or range, so only the iterator itself is new"

[[rate]]
key = "next"
fuel = "2"
input = "the item is part of the snapshot the iterator shares, and a Match is part of the replacement, so nothing is new"

[[rate]]
key = "make-closure"
fuel = "4 + count"
alloc = "size(result)"

[[rate]]
key = "call"
fuel = "8"

[[rate]]
key = "clause"
fuel = "4"
input = "each Handler Clause a dispatch tries, charged at the clause body's first instruction"

[[rate]]
key = "return"
fuel = "2"

[[rate]]
key = "test"
fuel = "1"

[[rate]]
key = "bin-field"
fuel = "2 + bytes(result) / 8 + scalars(result) / 8"
alloc = "size(result)"
input = "`result` is the value the field reads, which `bin-literal` has none of; for `bin-bits` it is the run's values, and their sizes add"

[[rate]]
key = "throw"
fuel = "10"
alloc = "48"
input = "the `at` map the Core adds, when it adds one"

[[rate]]
key = "unwind"
