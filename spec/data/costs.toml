input = "the Operation's result, converted into Script values"

[[rate]]
key = "send"
fuel = "20 + size(input) / 32"
alloc = "size(input)"
input = "the message, whose size counts toward the receiver's mailbox"

[[rate]]
key = "wait"
fuel = "10"

[[rate]]
key = "join"
fuel = "10"
alloc = "size(result)"

[[rate]]
key = "timeout"
fuel = "2"
alloc = "40"
input = "a deadline holds an Instant and the block's duration in `ms`"

