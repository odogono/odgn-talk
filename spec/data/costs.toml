# The Cost Model: the Fuel and allocation each instruction is charged, and the
# logical sizes that the Allocation Budget and Persistent State count.
#
# Each instruction's charge is a static base plus per-unit terms over measures
# of what it works on, applied whole at that instruction (ADR 0010). Changing a
# cost is a new Cost Model version (ADR 0006). The Abstract Machine is
# versioned with it. Cost Model 0 is provisional. Cost Model 1 is calibrated
# against both Cores after handoff (ADR 0032, Appendix C).
#
# Schema: schema/costs.schema.json. Shown in chapter 8 (regions `costs.*`).
#
# A formula is a sum of terms: `3 + characters(result) / 16 + 2 * items(input)`.
# A term is a whole number, or a measure, optionally multiplied by a whole
# number before it and divided by one after it. Each divided term rounds up on
# its own. Every formula gives a whole number, 0 or more.
#
#   version   the Cost Model version, an integer
#   [measure] each measure a formula may use, with what it counts
#   [subject] each value a measure may be taken of
#   [[size]]  the logical size of each kind of value, and of each part of a
#             Script's Persistent State
#     of      the kind, or the part
#     size    its formula, over `v`
#   [[rate]] one per Cost Model key named in machine.toml, and one per Built-in
#     key     the Cost Model key, or `builtin.<name>`
#     fuel    its Fuel formula
#     alloc   optional: its allocation formula, 0 if absent
#     input   optional: what `input` and `scanned` are for it
#   [[change]] each change made to this version's tables or charging rules
#             since it was first written, oldest first. Cost Model 0 is
#             provisional and no case is blessed, so it changes in place;
#             from Cost Model 1 on, a change is a new version.
#     issue   the issue that made it ("#115")
#     change  one sentence: what changed

version = 0

[measure]
size = "the logical size of the value, as the [[size]] table gives it"
contents = "the sum of the logical sizes of the values the value holds: a list's items, a map's keys and values, a range's ends, a Function Value's captures"
characters = "the number of Characters, for text; 0 for any other value"
scalars = "the number of Unicode scalar values, for text; 0 for any other value"
utf8 = "the length of the UTF-8 encoding, for text; 0 for any other value"
bytes = "the number of bytes, for Bytes; 0 for any other value"
items = "the number of items, for a list, and of integers, for an integer range; 0 for any other value"
entries = "the number of keys, for a map; 0 for any other value"
digits = "the number of digits in the coefficient, 1 for a zero, for a number or the number of a Quantity; 0 for any other value"
scanned = "what the instruction examines, as its rate's `input` says"
steps = "the Text Pattern matcher's steps: the threads in its list at each position, summed over the positions its runs reach (chapter 8, Running)"
program = "the number of instructions in a Text Pattern's compiled program (chapter 8, Compiling)"
frames = "the number of frames a catch search leaves or an offer lookup examines"
clauses = "the number of Handler Clauses a dispatch tries"
count = "the instruction's `count` operand, or 0 if it has none"
declared = "the Operation Declaration's per-call cost, which the Host sets"

[subject]
input = "the value the instruction works on, as its rate's `input` says"
result = "the value the instruction pushes, or the first of them"
v = "the value being measured, in a [[size]] formula"
x1 = "a Built-in's first argument, and x2, x3, … the others"

