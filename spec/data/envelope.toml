# Fields envelope tables (ADR 0110). Tags are hexadecimal in generated views.
# Required means structurally present; conditional checks remain in codecs.

features = ["request-pump-fields-v1", "callbacks-fields-v1", "settlements-fields-v1", "load-fields-v1", "queue-fields-v1"]

[[intentional_kinds]]
name = "grants"
kinds = ["record", "texts"]
reason = "Load binds Grant names to numeric handles; effect needs list Grant names."

[[intentional_kinds]]
name = "message"
kinds = ["message", "text"]
reason = "Request and unhandled Report messages are structured; failure messages are protocol text."

[[intentional_kinds]]
name = "operation"
kinds = ["record", "text"]
reason = "Callback operation names are text; call-failed Reports carry a capability/operation record."

[[intentional_kinds]]
name = "selector"
kinds = ["text", "value"]
reason = "Callback selectors are Values; run-started Report selectors are protocol text."

[[intentional_kinds]]
name = "broadcast"
kinds = ["bool", "text"]
reason = "A decide input's flag asks for a Broadcast Decision; Reports name the Broadcast id."

[[intentional_kinds]]
name = "fuel"
kinds = ["int", "uint"]
reason = "Reports carry nonnegative consumption; settlement late costs cross as signed integers before admission checks."

[[messages]]
tag = 0x01
name = "request"
direction = "host-to-guest"
fields = [
  { name = "ref", kind = "int", required = true },
  { name = "group", kind = "text", required = true },
  { name = "to", kind = "target", required = false },
  { name = "message", kind = "message", required = false },
]

