# The save format: the bytes every Core writes for a save and reads on a
# restore, whichever Core took it (ADR 0144).
#
# A save is a header followed by sections. Each section is framed by a tag, a
# flag byte, a length and its own SHA-256, so a reader can find, check or skip
# any section without decoding the others. The State Fingerprint and the body
# digest are computed from the sections' digests, so each byte is hashed once.
#
# Schema: schema/save-format.schema.json. Shown in chapter 10 (regions
# `save-format.*`). Owned by the chapter 10 task.
#
# [format]
#   magic, version  the first four bytes, and the save format version
#
# [[primitive]]     an encoding the fields below name as their type
#   name, encoding
#
# [[header]]        the header's fields, in order
#   name, type, is
#
# [[section]]       the sections, in ascending tag order, each at most once
#   tag             its byte, 1–255
#   name            its name
#   required        whether every save has it; a reader rejects an unknown
#                   required section and skips an unknown optional one
#   holds           one sentence
#   [[section.field]] name, type, is
#
# [[record]]        a structure fields refer to by name
#   name, holds, [[record.field]] name, type, is
#
# [[union]]         a structure that is one of several variants, written as
#                   its variant's tag byte and then that variant's fields
#   name, holds, [[union.variant]] tag, name, is, [[union.variant.field]]
#
# A type is a primitive, record or union name, `list of T` (a `uint` count
# then that many T), or `optional T` (a `bool`, then T when it is true).

[format]
magic = "NTSV"
version = 1

[[primitive]]
name = "magic"
encoding = "Four bytes, the `[format]` magic."

[[primitive]]
name = "byte"
encoding = "One byte."

[[primitive]]
name = "bool"
encoding = "One byte: 0 for false and 1 for true. Any other byte is `invalid save`."

[[primitive]]
name = "uint"
encoding = "An unsigned LEB128 integer, in its shortest form."

[[primitive]]
name = "sint"
encoding = "A signed LEB128 integer, in its shortest form."

[[primitive]]
name = "text"
encoding = "A `uint` byte length, then that many bytes of UTF-8."

[[primitive]]
name = "bytes"
encoding = "A `uint` length, then that many bytes."

[[primitive]]
name = "raw"
encoding = "Bytes whose length an earlier field gives."

[[primitive]]
name = "digest"
encoding = "32 bytes: a SHA-256 digest or a code identity."

[[primitive]]
name = "index"
encoding = "A `uint` position in a list this save already holds, counting from 0."

[[primitive]]
name = "ref"
encoding = "A `uint`: 0 for none, or a position in a list this save already holds plus 1."

[[header]]
name = "magic"
type = "magic"
is = "The bytes `NTSV`."

[[header]]
name = "format"
type = "uint"
is = "The save format version."

[[header]]
name = "language"
type = "text"
is = "The language version."

[[header]]
name = "cost model"
type = "uint"
is = "The Cost Model version."

[[header]]
name = "group fingerprint"
type = "digest"
is = "The Group Fingerprint (chapter 9) the save was taken under."

[[header]]
name = "save id counter"
type = "uint"
is = "The Trace save id counter, after this save."

[[header]]
name = "state fingerprint"
type = "digest"
is = "The State Fingerprint: the SHA-256 of each required section's tag byte and digest, in tag order."

[[header]]
name = "body digest"
type = "digest"
is = "The SHA-256 of every header byte before this field, then each section's tag byte, flag byte and digest, in order."

[[header]]
name = "sections"
type = "list of section"
is = "The sections, in ascending tag order."

[[record]]
name = "section"
holds = "One section's frame."

[[record.field]]
name = "tag"
type = "byte"
is = "The section's tag."

[[record.field]]
name = "flags"
type = "byte"
is = "Bit 0 set for an optional section; every other bit clear."

[[record.field]]
name = "length"
type = "uint"
is = "The body's length in bytes."

[[record.field]]
name = "digest"
type = "digest"
is = "The SHA-256 of the body."

[[record.field]]
name = "body"
type = "raw"
is = "`length` bytes: the section's fields, in order. Bytes left over after its last field are `invalid save`."

# ------------------------------------------------------------------ sections

[[section]]
tag = 1
name = "group"
required = true
holds = "The Group's counters and its record of issued call ids."

[[section.field]]
name = "name"
type = "text"
is = "The Group's name when it was first made. A restored Group writes its save's name here, whatever the Host names it, so its State Fingerprint equals its save's."

[[section.field]]
name = "clock"
type = "instant"
is = "The last Clock reading."

[[section.field]]
name = "deliveries"
type = "uint"
is = "The last Delivery id issued."

[[section.field]]
name = "broadcasts"
type = "uint"
is = "The last Broadcast id issued."

[[section.field]]
name = "timers"
type = "uint"
is = "The timer counter."

[[section.field]]
name = "run order"
type = "uint"
is = "The number of Runs the Group has started, counted at each `run started` report. A Run's `order` is this count when it started."

[[section.field]]
name = "charge counter"
type = "uint"
is = "The charge request counter."

[[section.field]]
name = "random state"
type = "uint"
is = "The Group's random generator state."

[[section.field]]
name = "issued calls"
type = "list of issued"
is = "Each Run's issued call numbers, by Run id in ascending byte order."

[[section]]
tag = 2
name = "libraries"
required = true
holds = "Every Library the Group holds, by identity."

[[section.field]]
name = "libraries"
type = "list of library"
is = "In the Group's order."

[[section]]
tag = 3
name = "objects"
required = true
holds = "Every Host Object the Group has seen, by Object Kind and id."

[[section.field]]
name = "objects"
type = "list of object"
is = "In the order the Group first saw them. A Value's or field's object `index` or `ref` points here."

[[section]]
tag = 4
name = "functions"
required = true
holds = "The code of every Function Value the save holds, and no other."

[[section.field]]
name = "functions"
type = "list of function"
is = "Numbered in the order the writer first meets a Function Value with that code: the other sections in tag order, each one's fields in order, and each value depth-first as written, a Function Value before its captures. A Function Value's `code` points here. The writer can't know this table until it has written the others, so it writes this section's body last and frames it in tag order."

[[section]]
tag = 5
name = "calls"
required = true
holds = "The Suspending Capability calls a Run still waits on."

[[section.field]]
name = "calls"
type = "list of call"
is = "In the order they were made."

[[section]]
tag = 6
name = "scripts"
required = true
holds = "Each Script's identity, limits, Grants, objects, variables and counters."

[[section.field]]
name = "declarations"
type = "list of grant declaration"
is = "Each distinct Grant declaration once, in the order the Grants first meet it: the Scripts in load order, each one's Grants in order. Two are the same when their encoded bytes are. A Grant's `declaration` points here."

[[section.field]]
name = "scripts"
type = "list of script"
is = "In load order."

[[section]]
tag = 7
name = "runs"
required = true
holds = "Every live Run, Script by Script, in each Script's live order."

[[section.field]]
name = "per script"
type = "list of uint"
is = "How many Runs each Script has, one per Script. It comes first, so a reader knows each Run's Script before it reads the Run's code positions."

[[section.field]]
name = "bases"
type = "list of segment base"
is = "Each distinct segment base once, in the order the Runs in `runs` first meet it. Two are the same when their encoded bytes are. A Run's `segment base` points here, and a Function Value in a base is met here, before `runs`."

[[section.field]]
name = "runs"
type = "list of run"
is = "The first Script's Runs, then the next Script's, in `scripts` order. A Run's `index` counts across this whole list."

[[section]]
tag = 8
name = "work"
required = true
holds = "Each Script's queued work."

[[section.field]]
name = "work"
type = "list of script work"
is = "One per Script, in `scripts` order."

[[section]]
tag = 9
name = "waits"
required = true
holds = "Every pending wait, with a deadline or not, in the order they were set."

[[section.field]]
name = "waits"
type = "list of deadline wait"
is = "Every Run's and Join Member's `pending`, in the order the waits were set."

[[section]]
tag = 10
name = "inputs"
required = true
holds = "The Host inputs queued for the next Pump."

[[section.field]]
name = "inputs"
type = "list of input"
is = "In queue order."

[[section]]
tag = 11
name = "decisions"
required = true
holds = "Broadcast Decisions some recipient hasn't sealed, and those a variables-only restore left for the first Pump."

[[section.field]]
name = "open"
type = "list of open broadcast"
is = "By Broadcast id, ascending."

[[section.field]]
name = "deferred"
type = "list of deferred decision"
is = "In the order they were deferred."

[[section]]
tag = 12
name = "accounting"
required = true
holds = "Run accounting: each root's discarded messages, and the roots whose work changed since the last report (chapter 9)."

[[section.field]]
name = "discards"
type = "list of root discards"
is = "By root id, ascending."

[[section.field]]
name = "changed roots"
type = "list of uint"
is = "In the order they changed."

[[section]]
tag = 13
name = "sources"
required = false
holds = "Each Script's base and extension sources, in an Embedded-source Snapshot."

[[section.field]]
name = "sources"
type = "list of script sources"
is = "One per Script, in `scripts` order."

