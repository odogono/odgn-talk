# The Unit Catalogue: every Unit, with its Unit Kind and exact factor.
#
# A language version pins it, and neither Hosts nor Scripts can add to it
# (ADR 0022). Every Unit is an exact factor times a product of base dimensions:
# length, mass, time, temperature, and one per currency. Calendar Units are a
# Unit Kind of their own, outside the dimension system, and never appear in a
# Compound Unit. The order of [[kind]] entries is the Kind order that a
# Compound Unit's factors print in.
#
# Schema: schema/units.schema.json. Shown in chapter 3 (regions `units.kinds`
# and `units.units`). Owned by the chapter 3 task.
#
# [[kind]]
#   name       the Unit Kind's name
#   base       its Base Unit
#   dimension  its product of base dimensions, e.g. "length^3"; absent for
#              calendar duration
#   factor     optional: the Base Unit's exact factor to the Base Units of its
#              dimension, when it isn't a single base dimension ("0.001" for L)
#   calendar   optional: true for the Calendar Unit Kind
#
# [[unit]]
#   name    its one canonical spelling
#   plural  optional: the plural of a word Unit; both forms are accepted
#   kind    its Unit Kind
#   factor  its exact factor to the Kind's Base Unit, as a decimal string
#   ratio   instead of factor: [numerator, denominator]; conversion multiplies
#           by the numerator, then divides by the denominator (only degF)

[[kind]]
name = "mass"
base = "kg"
dimension = "mass"

[[kind]]
name = "length"
base = "m"
dimension = "length"

[[kind]]
name = "volume"
base = "L"
dimension = "length^3"
factor = "0.001"

[[kind]]
name = "exact duration"
base = "s"
dimension = "time"

[[kind]]
name = "calendar duration"
base = "month"
calendar = true

[[kind]]
