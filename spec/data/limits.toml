# The resource limits a Host sets, and the default limit profile.
#
# A Host sets limits per Script at load, and zero fields take the defaults.
# Some limits can also be tightened for one Delivery, but never loosened: a
# loosening override is the Host error `invalid value` (ADRs 0006, 0015, 0026,
# #71). What exceeding each limit does is in `exceeded`.
#
# Every Core honours any value from 1 up to a limit's conformance minimum
# exactly. A Core may honour larger values too, and refuses a value it can't
# honour as `invalid value`. Conformance cases stay within the minimums.
#
# Schema: schema/limits.schema.json. Shown in chapter 6 (region `limits`).
#
# [[limit]]
#   name         its name in the Spec
#   go           its field in talk.go's Limits
#   ts           its field in talk.ts's Limits
#   measure      what it counts
#   per          what it applies to: "run", "script", "join" or "wait"
#   overridable  whether a Delivery's LimitOverride can tighten it
#   default      its value in the default limit profile
#   minimum      its conformance minimum, no less than the default
#   exceeded     what exceeding it does
#   sources      the ADRs and issues that settle it

[[limit]]
name = "Fuel per Run"
go = "FuelPerRun"
ts = "fuelPerRun"
measure = "Fuel"
per = "run"
overridable = true
default = 10_000_000
minimum = 1_000_000_000
exceeded = "a Limit Fault"
sources = ["ADR 0006", "#71"]

[[limit]]
name = "Allocation Budget"
go = "AllocPerRun"
ts = "allocPerRun"
measure = "logical size"
per = "run"
overridable = true
default = 16_777_216
minimum = 268_435_456
exceeded = "a Limit Fault"
sources = ["ADR 0006", "#71"]

[[limit]]
name = "Persistent State"
go = "PersistentState"
ts = "persistentState"
measure = "logical size"
per = "script"
overridable = false
default = 1_048_576
minimum = 67_108_864
exceeded = "a Limit Fault, measured at each Segment end"
sources = ["ADR 0006", "ADR 0010", "#71"]

[[limit]]
name = "call depth"
go = "CallDepth"
ts = "callDepth"
measure = "frames"
per = "run"
overridable = false
default = 200
minimum = 1_000
exceeded = "a Limit Fault, at the call"
sources = ["ADR 0020", "#71"]

[[limit]]
name = "mailbox depth"
go = "MailboxDepth"
ts = "mailboxDepth"
measure = "messages"
per = "script"
overridable = false
default = 1_000
minimum = 10_000
exceeded = "`mailbox full` at a Script's `send`; `MailboxFull` at a Host call"
sources = ["ADR 0017", "#71"]

[[limit]]
name = "MaxWait"
go = "MaxWait"
ts = "maxWaitMs"
measure = "whole milliseconds"
per = "wait"
overridable = true
default = 30_000
minimum = 2_147_483_647
exceeded = "`timeout`, and the call is abandoned"
sources = ["ADR 0015", "ADR 0026", "#71"]

[[limit]]
name = "MaxJoin"
go = "MaxJoin"
ts = "maxJoin"
measure = "Join Members"
per = "join"
overridable = true
default = 16
minimum = 256
exceeded = "a Limit Fault, at the member that would pass it"
sources = ["ADR 0026", "#71"]

[[limit]]
name = "Cleanup Budget"
go = "CleanupBudget"
ts = "cleanupBudget"
measure = "Fuel"
per = "run"
overridable = false
default = 10_000
minimum = 1_000_000
exceeded = "the remaining cleanup ends, and the report says `cleanup failed`"
sources = ["ADR 0017"]
