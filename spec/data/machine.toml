suspends = false
cost = "return"
does = "Ends a failed clause, test or branch body, so the Core tries the next"

# ---------------------------------------------------------------------------
# Destructuring
# ---------------------------------------------------------------------------

[[instruction]]
name = "test-constant"
group = "patterns"
operands = ["constant", "fold?", "label"]
pops = 1
pushes = 0
suspends = false
cost = "test"
does = "Pops a value, and jumps to the label unless it `=` the constant"

[[instruction]]
name = "test-equal"
group = "patterns"
operands = ["label"]
pops = 2
pushes = 0
suspends = false
cost = "test"
does = "Pops two values, and jumps to the label unless they are `=`, for a pin"

[[instruction]]
name = "test-list"
group = "patterns"
operands = ["count", "label"]
pops = 1
pushes = 0
suspends = false
cost = "test"
does = "Pops a value, and jumps unless it is a list of exactly `count` items"

[[instruction]]
name = "test-list-at-least"
group = "patterns"
operands = ["count", "label"]
pops = 1
pushes = 0
suspends = false
cost = "test"
does = "Pops a value, and jumps unless it is a list of `count` items or more"

[[instruction]]
name = "list-item"
group = "patterns"
operands = ["index"]
pops = 1
pushes = 1
suspends = false
cost = "test"
does = "Pops a list the pattern has tested, and pushes its item at `index`"

[[instruction]]
name = "list-rest"
group = "patterns"
operands = ["index"]
pops = 1
pushes = 1
suspends = false
cost = "list"
does = "Pops a list the pattern has tested, and pushes its items from `index` on"

[[instruction]]
name = "test-map"
group = "patterns"
operands = ["label"]
pops = 1
pushes = 0
suspends = false
cost = "test"
does = "Pops a value, and jumps unless it is a map"

[[instruction]]
name = "map-get"
group = "patterns"
operands = ["key", "label"]
pops = 1
pushes = 1
suspends = false
cost = "test"
does = "Pops a map, and pushes its value under the key, or jumps if it has no such key"

[[instruction]]
name = "match-whole"
group = "patterns"
operands = ["fold?", "label"]
pops = 2
pushes = 1
suspends = false
cost = "match"
does = "Pops a Text Pattern and a value, and pushes the Captures map of a whole-text match, or jumps"

[[instruction]]
name = "match-search"
group = "patterns"
operands = ["fold?", "label"]
pops = 2
pushes = 1
suspends = false
cost = "match"
does = "Pops a Text Pattern and a value, and pushes the Captures map of the first match, or jumps"

[[instruction]]
name = "bin-start"
group = "patterns"
operands = ["label"]
pops = 1
pushes = 1
suspends = false
cost = "test"
does = "Pops a value, and pushes a reader at its first byte, or jumps unless it is Bytes"

[[instruction]]
name = "bin-literal"
group = "patterns"
operands = ["constant", "label"]
pops = 1
pushes = 1
suspends = false
cost = "bin-field"
does = "Reads the constant's bytes, or pops the reader and jumps if they differ or run out"

[[instruction]]
name = "bin-int"
group = "patterns"
operands = ["field", "label"]
pops = 1
pushes = 2
suspends = false
cost = "bin-field"
does = "Reads an integer field and pushes it above the reader, or pops the reader and jumps"

[[instruction]]
name = "bin-bits"
group = "patterns"
operands = ["constant", "count", "label"]
pops = 1
pushes = "count + 1"
suspends = false
cost = "bin-field"
does = "Reads a run of `count` bit fields of the widths the constant lists, and pushes each above the reader"

[[instruction]]
name = "bin-bytes"
group = "patterns"
operands = ["field", "label"]
pops = 2
pushes = 2
suspends = false
cost = "bin-field"
does = "Pops a size, and reads that many bytes, as Bytes or as text, above the reader, or pops the reader and jumps"

[[instruction]]
name = "bin-rest"
group = "patterns"
operands = ["field", "label"]
pops = 1
pushes = 1
suspends = false
cost = "bin-field"
does = "Pops the reader, and pushes the bytes left, as Bytes or as text, or jumps if they don't decode"

[[instruction]]
name = "bin-end"
group = "patterns"
operands = ["label"]
pops = 1
pushes = 0
suspends = false
cost = "test"
does = "Pops the reader, and jumps unless every byte was read"

