[[instruction]]
name = "end-cleanup"
group = "errors"
operands = []
pops = 0
pushes = 0
suspends = false
cost = "return"
does = "Ends a `finally` block reached by an error or a cancellation, which then goes on"

# ---------------------------------------------------------------------------
# Effects and suspension
# ---------------------------------------------------------------------------

[[instruction]]
name = "ask"
group = "effects"
operands = ["grant", "operation", "count"]
pops = "count"
pushes = 1
suspends = false
cost = "capability"
errors = ["wrong kind", "capability revoked", "host error", "capability disabled", "scope already open", "scope not open", "scope in join", "segment participant conflict"]
does = "Calls an immediate Operation, and pushes its result"

[[instruction]]
name = "ask-wait"
group = "effects"
operands = ["grant", "operation", "count"]
pops = "count"
pushes = 1
suspends = true
cost = "capability"
errors = ["wrong kind", "capability revoked", "host error", "timeout", "capability disabled", "scope open"]
does = "Calls a suspending Operation, and suspends until it answers"

[[instruction]]
name = "tell"
group = "effects"
operands = ["grant", "operation", "count"]
pops = "count"
pushes = 0
suspends = false
cost = "capability"
errors = ["wrong kind", "capability revoked", "host error", "capability disabled"]
does = "Calls a fire-and-forget Operation"

[[instruction]]
name = "send"
group = "effects"
operands = ["message", "count"]
pops = "count + 1"
pushes = 0
suspends = false
cost = "send"
errors = ["mailbox full", "object gone", "wrong kind"]
does = "Pops the receiver and `count` arguments, and puts the message in the receiver's mailbox"

[[instruction]]
name = "send-wait"
group = "effects"
operands = ["message", "count"]
pops = "count + 1"
pushes = 1
suspends = true
cost = "send"
errors = ["mailbox full", "object gone", "wrong kind", "send failed", "timeout", "scope open"]
does = "Sends as `send` does, then suspends until the reply"

[[instruction]]
name = "send-named"
group = "effects"
operands = ["count"]
pops = "count + 2"
pushes = 0
suspends = false
cost = "send"
errors = ["bad message name", "mailbox full", "object gone", "wrong kind"]
does = "Pops the receiver, `count` arguments and the message name below them, checks the name, and sends as `send` does"

[[instruction]]
name = "send-named-wait"
group = "effects"
operands = ["count"]
pops = "count + 2"
pushes = 1
suspends = true
cost = "send"
errors = ["bad message name", "mailbox full", "object gone", "wrong kind", "send failed", "timeout", "scope open"]
does = "Sends as `send-named` does, then suspends until the reply"

[[instruction]]
name = "send-up"
group = "effects"
operands = ["message", "count"]
pops = "count"
pushes = 0
suspends = false
cost = "send"
errors = ["mailbox full"]
does = "A Command Call with no Handler: sends the message up the Message Path"

[[instruction]]
name = "send-up-wait"
group = "effects"
operands = ["message", "count"]
pops = "count"
pushes = 1
suspends = true
cost = "send"
errors = ["mailbox full", "send failed", "timeout", "scope open"]
does = "`name args and wait` with no Handler: sends up the Message Path and waits"

[[instruction]]
name = "wait"
group = "effects"
operands = []
pops = 1
pushes = 0
suspends = true
cost = "wait"
errors = ["wrong kind", "scope open"]
does = "`wait d`: pops an exact duration, and suspends until it has passed"

[[instruction]]
name = "wait-for"
group = "effects"
operands = ["event"]
pops = "event"
pushes = 1
suspends = true
cost = "wait"
errors = ["wrong kind", "scope open"]
does = "Suspends until an event of the entry arrives, and pushes the message, or Nothing on a timeout"

[[instruction]]
name = "wait-for-any"
group = "effects"
operands = ["event"]
pops = "event"
pushes = 2
suspends = true
cost = "wait"
errors = ["wrong kind", "scope open"]
does = "The block `wait for`: suspends until a branch fires, and pushes its message or Nothing, then its number"

[[instruction]]
name = "join-start"
group = "effects"
operands = []
pops = 0
pushes = 0
suspends = false
cost = "join"
does = "Starts a Join"
errors = ["scope open"]

[[instruction]]
name = "join-ask"
group = "effects"
operands = ["grant", "operation", "count"]
pops = "count"
pushes = 0
suspends = false
cost = "capability"
errors = ["wrong kind", "capability revoked", "capability disabled"]
does = "Starts a suspending Operation as a Join Member"

[[instruction]]
name = "join-send"
group = "effects"
operands = ["message", "count"]
pops = "count + 1"
pushes = 0
suspends = false
cost = "send"
errors = ["mailbox full", "object gone", "wrong kind"]
does = "Starts a `send … and wait` as a Join Member"

[[instruction]]
name = "join-send-named"
group = "effects"
operands = ["count"]
pops = "count + 2"
pushes = 0
suspends = false
cost = "send"
errors = ["bad message name", "mailbox full", "object gone", "wrong kind"]
does = "Starts a `send (e) … and wait` as a Join Member, checking the name as `send-named` does"

[[instruction]]
name = "join-end"
group = "effects"
operands = []
pops = 0
pushes = 1
suspends = true
cost = "join"
errors = ["send failed", "timeout"]
