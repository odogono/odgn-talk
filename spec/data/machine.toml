[[instruction]]
name = "rethrow"
group = "errors"
operands = []
pops = 1
pushes = 0
suspends = false
cost = "throw"
does = "Raises the popped error again, from a `catch` block no clause matched"

[[instruction]]
name = "raise"
group = "errors"
operands = ["code"]
pops = 0
pushes = 0
suspends = false
cost = "throw"
