[[instruction]]
name = "veto"
group = "effects"
operands = []
pops = 1
pushes = 0
suspends = false
cost = "return"
does = "Pops the reason, vetoes the Decision and ends the Run"

[[instruction]]
name = "pass"
group = "effects"
operands = ["message"]
pops = 0
pushes = 0
suspends = false
cost = "send"
does = "Ends the Run and sends its message on up the Message Path"
