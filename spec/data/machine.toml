# The Abstract Machine's instruction set.
#
# A stack machine with numbered local slots. Every construct lowers to an exact
# instruction sequence, and each instruction is one language-level operation
# (ADR 0010). Chapter 8 states what each one does and how each construct
# lowers to them.
#
# Schema: schema/machine.schema.json. Shown in chapter 8 (region `machine`).
#
#   operand kinds     what an operand can be, with its disassembly form
#   [[instruction]]
#     name      the opcode's name in the canonical disassembly, e.g. "chunk-get"
#     group     the section of chapter 8's table it is listed under
#     operands  the operand kinds, in order; a kind ending in `?` is optional,
#               and absent from the disassembly when it doesn't apply
#     pops      how many values it pops: a number, or an operand kind whose
#               value is the count, optionally plus a number ("count + 1")
#     pushes    how many values it pushes, in the same notation
#     jumps     optional: for an instruction with a label, how many values it
#               leaves pushed when it jumps, after its pops (0 unless given)
#     suspends  whether it is a Suspension Point
#     cost      its Cost Model key in costs.toml
#     errors    optional: the Error Codes it can raise itself, from errors.toml
#     does      one sentence: what it does

[operand]
constant = "an index into the code unit's constant pool, shown with the constant"
local = "a local slot of the current body, shown with its name"
variable = "a Script Variable's slot, shown with its name"
definition = "a Constant of the code unit or of an Import, shown by its name in the definitions"
body = "a body of the code unit, shown by its index, with its name"
import = "an imported function, Handler or Constant, shown as library:name"
builtin = "a Built-in function, shown by name"
handler = "a Handler of the code unit, or an imported one, shown by name"
grant = "a Grant, by the name the Script uses"
operation = "an Operation name"
message = "a message name"
object = "a well-known object or Script name, shown by name"
label = "an instruction index in the same body, shown as the code's indices are"
count = "a non-negative integer"
index = "a positive integer"
kind = "a kind name, `integer`, or a Unit, as written after `is a`, `as` or `can be`"
chunk = "a chunk kind: character, word, line, item, byte or code point"
property = "a Built-in property name"
key = "a map key, shown as text in the display form"
fold = "`fold` if the operation ignores case, and absent otherwise"
field = "a Binary Pattern field type: an integer type with its byte order, or a size unit"
event = "an entry of the code unit's event table"
code = "an Error Code from errors.toml"

# ---------------------------------------------------------------------------
# Values and slots
# ---------------------------------------------------------------------------

[[instruction]]
name = "const"
group = "values"
operands = ["constant"]
pops = 0
pushes = 1
suspends = false
cost = "const"
does = "Pushes a constant from the pool"

[[instruction]]
name = "pop"
group = "values"
operands = []
pops = 1
pushes = 0
suspends = false
cost = "stack"
does = "Discards the top value"

[[instruction]]
name = "load"
group = "values"
operands = ["local"]
pops = 0
pushes = 1
suspends = false
cost = "slot"
does = "Pushes a local"

[[instruction]]
name = "store"
group = "values"
operands = ["local"]
pops = 1
pushes = 0
suspends = false
cost = "slot"
does = "Pops a value into a local"

[[instruction]]
name = "move"
group = "values"
operands = ["local", "local"]
pops = 0
pushes = 0
suspends = false
cost = "slot"
does = "Copies the first local into the second, which commits a pattern's binding"

[[instruction]]
name = "load-var"
group = "values"
operands = ["variable"]
pops = 0
pushes = 1
suspends = false
cost = "slot"
does = "Pushes a Script Variable"

[[instruction]]
name = "store-var"
group = "values"
operands = ["variable"]
pops = 1
pushes = 0
suspends = false
cost = "store-var"
does = "Pops a value into a Script Variable"

[[instruction]]
name = "load-definition"
group = "values"
operands = ["definition"]
pops = 0
pushes = 1
suspends = false
cost = "slot"
does = "Pushes a Constant, the code unit's own or an imported one"

[[instruction]]
name = "store-definition"
group = "values"
operands = ["definition"]
pops = 1
pushes = 0
suspends = false
cost = "slot"
does = "Pops a Constant's value, in the code unit's initialiser only"

[[instruction]]
name = "load-object"
group = "values"
operands = ["object"]
pops = 0
pushes = 1
suspends = false
cost = "slot"
does = "Pushes the well-known Host Object or Script bound to a name at load"

[[instruction]]
name = "me"
group = "values"
operands = []
pops = 0
pushes = 1
suspends = false
cost = "slot"
does = "Pushes `me`"

[[instruction]]
name = "target"
group = "values"
operands = []
pops = 0
pushes = 1
suspends = false
cost = "slot"
does = "Pushes `the target`"

