# Loops
# ---------------------------------------------------------------------------

[[instruction]]
name = "iterate"
group = "loops"
operands = []
pops = 1
pushes = 1
suspends = false
cost = "iterate"
errors = ["wrong kind"]
does = "Pops a list or an integer range, and pushes an iterator over a snapshot of it"

[[instruction]]
name = "iterate-times"
group = "loops"
operands = []
pops = 1
pushes = 1
suspends = false
cost = "iterate"
errors = ["wrong kind", "out of range"]
does = "Pops a count, and pushes an iterator that runs that many times"

[[instruction]]
name = "next"
group = "loops"
operands = ["label"]
pops = 1
pushes = 2
jumps = 1
suspends = false
cost = "next"
does = "Pushes the iterator's next item above it, or jumps to the label, leaving the iterator, when there are none"

# ---------------------------------------------------------------------------
# Errors
# ---------------------------------------------------------------------------

[[instruction]]
name = "throw"
group = "errors"
operands = []
pops = 1
pushes = 0
suspends = false
cost = "throw"
errors = ["bad throw"]
