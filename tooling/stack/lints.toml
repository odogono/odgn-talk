# Tooling advice, outside parity (chapter 12 and ADR 0028).
# More than 20 physical source lines between a Join head and its ending is long.
# Blank lines and comment-only lines count. The head and ending do not.
[settings]
long_join_body_lines = 20

[[lint]]
id = "advanced-construct"
flags = "an Advanced Construct"
beginner = "warning"
standard = "off"
message = "{construct} is an Advanced Construct. Try {beginner}."
status = "implemented"

[[lint]]
id = "prefer-explicit-end"
flags = "a bare block-ending `end`, suggesting its matching explicit ending"
beginner = "warning"
standard = "off"
message = "Write end {ending} to show which block ends here."
status = "implemented"

[[lint]]
id = "suggest-ignoring-case"
flags = "a text comparison that probably wants `ignoring case`"
beginner = "hint"
standard = "off"
message = "This comparison is case-sensitive. Consider ignoring case when comparing names or words."
status = "implemented"

[[lint]]
id = "unreachable-clause"
flags = "a Handler Clause that an earlier clause always wins over"
beginner = "warning"
standard = "warning"
message = "An earlier clause for {message} always matches first."
status = "implemented"

[[lint]]
id = "pin-trap"
flags = "a pattern name that shadows a Script Variable, and so binds rather than compares"
beginner = "warning"
standard = "hint"
message = "{name} binds a new pattern name here. Use ^{name} to compare the Script Variable."
status = "implemented"

[[lint]]
id = "is-empty-on-missing-key"
flags = "`is empty` on a key the map may lack"
beginner = "warning"
standard = "hint"
message = "A missing key gives nothing, which is not empty. Check whether {key} exists first."
status = "implemented"

[[lint]]
id = "whole-value-when"
flags = "a whole-value `when <\"WARN\">` probably meant as `when contains`"
beginner = "warning"
standard = "hint"
message = "This Text Pattern must match the whole value. Consider when contains to find it within the text."
status = "implemented"

[[lint]]
id = "try-write-before-fail"
flags = "a Script Variable written inside `try` before a statement that can fail, since a caught error rolls nothing back"
beginner = "warning"
standard = "warning"
message = "{name} is written before a statement that may fail. A caught error does not roll this write back."
status = "implemented"

[[lint]]
id = "inline-block-lambda"
flags = "a block Lambda written inline as an argument, rather than named first"
beginner = "hint"
standard = "hint"
message = "Give this block Lambda a name before passing it as an argument."
status = "implemented"

[[lint]]
id = "long-join-body"
flags = "a Join body whose head scrolls out of view"
beginner = "hint"
standard = "hint"
message = "This Join body spans {lines} source lines. Consider keeping it within {threshold} lines."
status = "implemented"

[[lint]]
id = "plain-send-in-join"
flags = "a plain `send` inside a Join, probably a forgotten `and wait`"
beginner = "warning"
standard = "warning"
message = "This send is not a Join Member. Add and wait if the Join should wait for its answer."
status = "implemented"

[[lint]]
id = "conditional-join-member"
flags = "a Join Member inside an `if`, which makes the length of `it` depend on the data"
beginner = "warning"
standard = "hint"
message = "This conditional Join Member makes the length of it depend on the data."
status = "implemented"

[[lint]]
id = "serialised-self-join"
flags = "a Join that sends to `me` for a message whose clauses all opt out of concurrency"
beginner = "warning"
standard = "warning"
message = "All clauses for {message} opt out of concurrency. This Join sends to its own Script."
status = "implemented"

[[lint]]
id = "key-shadows-property"
flags = "a map literal key that shadows a Built-in property"
beginner = "warning"
standard = "warning"
message = "{key} is also a Built-in property. Use a quoted key to read this map entry."
status = "implemented"

[[lint]]
id = "unknown-message"
flags = "a Handler for a message the Host Manifest doesn't declare"
beginner = "hint"
standard = "hint"
message = "The Host Manifest does not declare the message {message}."
status = "implemented"

[[lint]]
id = "fallback-routes-known"
flags = "a Fallback Handler clause that compares the message's name with a Selector the Script has named clauses for, which runs only when those clauses fail"
beginner = "hint"
standard = "hint"
message = "{message} has its own Handler, so this Fallback clause runs only when that Handler's clauses don't match."
status = "implemented"

[[lint]]
id = "ambiguous-ignoring-case"
flags = "a trailing `ignoring case` after an `and` or `or` chain, which binds only to the nearest comparison"
beginner = "warning"
standard = "hint"
message = "ignoring case applies only to the nearest comparison. Add it to each comparison or use parentheses to make this clear."
status = "implemented"

[[lint]]
id = "shadows-builtin"
flags = "a Script name that shadows a Built-in Constant or function"
beginner = "warning"
standard = "hint"
message = "{name} shadows a Built-in {kind}. Choose another name to keep the Built-in available."
status = "implemented"

[[lint]]
id = "unconvertible-literal"
flags = "a literal text given to `as civil date` or `as instant` that can't convert"
beginner = "warning"
standard = "warning"
message = "This literal text cannot convert to {kind}. Check its date, time and zone."
status = "implemented"

[[lint]]
id = "suggest-collecting"
flags = "a loop immediately after `put [] into acc` whose body appends to acc"
beginner = "hint"
standard = "off"
message = "Consider collecting each value into {name} in the repeat head."
status = "implemented"

[[lint]]
id = "store-race"
flags = "a `store` `set` of a key whose value came from a `get` of that key through the same Grant in one Handler"
beginner = "hint"
standard = "warning"
message = "Another Script can change {key} between this get and set. Use increment or swap to update it in one call."
status = "implemented"

[[lint]]
id = "suggest-list-splice"
flags = "`put xs after acc` when xs has clear list evidence, suggesting a splice"
beginner = "hint"
standard = "off"
message = "This adds a list as one element. Consider ... before the list expression to append its items instead."
status = "implemented"
