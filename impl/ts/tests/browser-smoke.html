<!doctype html>
<meta charset="utf-8">
<title>NorthTalk browser smoke test</title>
<pre id="result">Running…</pre>
<script type="module">
  import * as talk from "/index.js";
  const assert = (ok, message) => { if (!ok) throw new Error(message); };
  const platform = { normalize: String.prototype.normalize, upper: String.prototype.toUpperCase, lower: String.prototype.toLowerCase, segmenter: Intl.Segmenter };
  try {
    // A browser's Unicode version cannot affect Core values.
    String.prototype.normalize = () => { throw new Error("Platform normalization used"); };
    String.prototype.toUpperCase = () => { throw new Error("Platform uppercase used"); };
    String.prototype.toLowerCase = () => { throw new Error("Platform lowercase used"); };
    Intl.Segmenter = class { constructor() { throw new Error("Platform segmentation used"); } };
    const value = talk.text("e\u0301");
    assert(value.asText() === "é", "NFC constructor");
    assert(talk.text("\u1100\u1161\u11a8").asText() === "각", "Hangul NFC");
    const nested = talk.map([["2", talk.num(2)], ["1", talk.list(value)], ["__proto__", talk.bool(true)]]);
    assert(talk.encodeValue(nested) === '{"2":2,"1":["é"],"__proto__":true}', "Encoding order");
    assert(talk.decodeValue(talk.encodeValue(nested), () => undefined).equals(nested), "Encoding round trip");
    assert(talk.readDisplay(nested.toString()).equals(nested), "Display round trip");
    assert(talk.num(0.1).asDecimal().toString() === "0.1", "Float constructor");
    let refused = false;
    try { talk.text("\ud800"); } catch (error) { refused = error instanceof talk.HostError && error.code === "invalid value"; }
    assert(refused, "Lone surrogate refusal");
    let deep = talk.nothing;
    for (let i = 0; i < 3000; i++) deep = i % 2 ? talk.list(deep) : talk.map([["$deep", deep]]);
    assert(talk.readDisplay(deep.toString()).equals(deep), "Deep display round trip");
    assert(talk.decodeValue(talk.encodeValue(deep), () => undefined).equals(deep), "Deep encoding round trip");
    assert(talk.encodeJson(talk.decodeJson('{"2":2.50,"1":1e5,"$dec":"e\\u0301"}')) === '{"2":2.50,"1":100000,"$dec":"é"}', "Plain JSON digits, NFC and order");
    assert(talk.decodeJson(talk.encodeJson(deep)).equals(deep), "Deep plain JSON round trip");
    refused = false;
    try { talk.decodeJson('{"é":1,"e\\u0301":2}'); } catch (error) { refused = error instanceof talk.ScriptError && error.code === "can't decode" && error.data.get("offset").toString() === "8"; }
    assert(refused, "Plain JSON duplicate key refusal");
    refused = false;
    try { talk.encodeJson(talk.list(talk.bytes(new Uint8Array()))); } catch (error) { refused = error instanceof talk.ScriptError && error.code === "not encodable" && error.data.get("path").toString() === "[1]"; }
    assert(refused, "Plain JSON unsupported kind path");
    assert(talk.coreVersions.language === "1.0-rc.2" && talk.coreVersions.costModel === "0" && talk.coreVersions.unicode === "18.0.0" && talk.coreVersions.saveFormat === "5", "Core versions");
    const source = '\ufeff-- 😀 comment\r\non t\r\n put ["e\u0301", -- list\r\n 2] into xs\r\nend t -- eof';
    const parsed = talk.parseSource(source);
    assert(parsed.error === null && talk.syntaxText(parsed.tree) === source, "Lossless Core parser");
    const editing = 'on t x\n @\n put [1 + , 2] into broken\n put x into kept\n return missing\nend t';
    const recovered = talk.parseSourceRecovering(editing);
    const strict = talk.parseSource(editing);
    assert(recovered.error.code === strict.error.code && recovered.error.tok.pos === strict.error.tok.pos && talk.syntaxText(recovered.tree) === editing, "Lossless parser recovery and normative first error");
    assert(recovered.diagnostics.length === 2 && recovered.diagnostics[0].recovery === false && recovered.diagnostics[1].recovery === true, "Recovery diagnostic markers");
    const recoveredCheck = talk.checkSyntax(recovered.tree);
    assert(recoveredCheck.diagnostics.length === 1 && recoveredCheck.diagnostics[0].code === "unknown name" && recoveredCheck.diagnostics[0].span.line === 5 && recoveredCheck.tree.scopes.some(scope => scope.kind === "handler" && scope.bindings.some(binding => binding.name === "kept")), "Recovered checker diagnostics, scopes and bindings");
    const deepSource = 'constant nested = ' + '['.repeat(3000) + '1' + ']'.repeat(3000);
    const deepParse = talk.parseSource(deepSource);
    assert(deepParse.error === null && talk.syntaxText(deepParse.tree) === deepSource, "Deep lossless parsing");
    const bad = talk.parseSource('on t\n put "😀" & return into x\nend t');
    assert(bad.error.code === "unexpected token" && bad.error.tok.line === 2 && bad.error.tok.col === 12, "Scalar syntax diagnostic");
    assert(talk.checkSource('on t\n return later\n put 1 into later\nend t').ok, "Whole-body name resolution");
    assert(talk.checkSource(deepSource).ok, "Deep semantic checking");
    const names = talk.checkSource('on t\n put "😀" & missing into x\nend t');
    assert(!names.ok && names.diagnostics[0].code === "unknown name" && names.diagnostics[0].span.col === 12, "Scalar name diagnostic");
    const builtin = talk.checkSource('on t\n return min\nend t');
    assert(builtin.diagnostics[0].code === "not a value", "Built-in name catalogue");
    const contracts = talk.checkSource('constant c = 1\non t\n put f() into c\n set x to 1\nend t\nfunction f a = me, b\nend f');
    assert(JSON.stringify(contracts.diagnostics.map(({ code, span }) => [code, span.line, span.col])) === JSON.stringify([
      ["wrong argument count", 3, 6], ["can't write", 3, 15], ["not a property", 4, 2],
      ["not constant", 6, 16], ["default order", 6, 20]
    ]), "Binding and function contract diagnostics");
    const imported = talk.checkSource('use sortBy from list\non t\n sortBy([])\nend t');
    assert(imported.diagnostics[0].code === "wrong argument count", "Standard Library function contract");
    const captures = talk.checkSource('on t x\n put given\n  delete x\n end given into f\nend t');
    assert(captures.diagnostics[0].code === "can't write", "Read-only Lambda capture");
    assert(talk.checkSource('constant identity = given x: x\nconstant labels = ["me", "it"]').ok, "Deferred Lambda literal and text literals");
    const control = talk.checkSource('on t, queued, queued\n exit repeat\n put given: the target into f\nfinally\n pass u\nend t');
    assert(JSON.stringify(control.diagnostics.map(({ code, span }) => [code, span.line, span.col])) === JSON.stringify([
      ["bad suffixes", 1, 15], ["outside a loop", 2, 2], ["not in a lambda", 3, 13],
      ["leaves finally", 5, 2], ["wrong message", 5, 7]
    ]), "Control-flow and body-context diagnostics");
    const constructs = talk.checkSource('private on t x where f(x)\n put [{a: 1, "a": 2}, x as list, <optional <n: digit>>, <<1 as 3 bits>>] into y\nend t');
    assert(JSON.stringify(constructs.diagnostics.map(({ code, span }) => [code, span.line, span.col])) === JSON.stringify([
      ["not in a script", 1, 1], ["unknown name", 1, 22], ["not in a guard", 1, 22], ["duplicate key", 2, 14],
      ["no conversion", 2, 25], ["capture in repetition", 2, 45], ["bits not whole bytes", 2, 59]
    ]), "Construct and Guard diagnostics");
    const lowered = talk.compileSource('on t x where x > 0\n put "e\u0301" into item 2 of x\n return x\nend t', { name: "smoke" });
    const listing = talk.disassemble(lowered.unit);
    assert(listing.startsWith("unit smoke script\nconstants\n  0 nothing\n  1 0\n  2 \"é\"\n") && listing.endsWith("unwind\n  0002..0005 guard -> 0021 depth 0\n"), "Lowering and canonical disassembly");
    const deepUnit = talk.compileSource(deepSource, { name: "deep" });
    assert(deepUnit.unit.code.length === 3004, "Deep lowering");
    const machine = talk.loadScript(talk.compileSource('script variable seen\non go s\n put the length of s into seen\n put character 2 of s into c\n return [c, s contains <"q">, every match of <word> in "cat, dog", 1 / 3]\nend go', { name: "smoke" }).unit);
    const ran = talk.deliver(machine, "go", [talk.text("a👩\u200d👩\u200d👧q\u0301b")]).finish();
    assert(ran.kind === "completed" && ran.result.toString() === '["👩‍👩‍👧", false, [{text: "cat,", range: 1..4, captures: {}, ranges: {}}, {text: "dog", range: 6..8, captures: {}, ranges: {}}], 0.3333333333333333333333333333333333]' && machine.variables[0].toString() === "4", "Abstract Machine");
    const lines = [];
    const core = talk.createCore();
    const group = core.newGroup({ name: "smoke", trace: line => lines.push(line) });
    group.load({ name: "a", source: "script variable n = 0\non bump\n  add 1 to n\nend bump" }).deliver({ name: "bump" });
    group.pump(talk.parseInstant("2026-09-30T09:00:00Z"));
    group.inspect();
    assert(lines[0] === "> load a identity=" + talk.codeIdentity("script", "a", "script variable n = 0\non bump\n  add 1 to n\nend bump") && lines.at(-1) === "vars a n=1" && lines.includes("pumped state=idle fuel=17"), "Group and Trace");
    const restored = core.restore(group.save(), { name: "copy", libraries: [], onMismatch: "reject", grants: () => undefined, resolve: () => undefined });
    assert(restored.group.inspect().scripts[0].vars[0][1].toString() === "1", "Core restore");
    const library = core.compileLibrary({ name: "helpers", version: "1", source: "function double x\n  return x * 2\nend double" });
    const console = core.consoleCapability({ write() { throw new Error("Manifest called the Host"); }, read() { throw new Error("Manifest called the Host"); } }, { write: { fuel: 1 }, read: { fuel: 1 } });
    const manifest = talk.exportManifest({ kind: "smoke", version: "1", grants: { console: console.grant(["write"], { secret: "host-only" }) }, libraries: [library] });
    assert(!manifest.includes("host-only") && manifest.endsWith("\n") && JSON.parse(manifest).libraries[0].source === library.source, "Host Manifest");
    document.querySelector("#result").textContent = "PASS: NFC, Hangul, ordered values, display, encoding, plain JSON, Core versions, decimal, invalid input, deep values, lossless parsing, parser/checker recovery, name resolution, binding/function contracts, control-flow and construct checks, lowering, disassembly, the Abstract Machine, the Group, Core restore and Host Manifests in a browser";
    globalThis.smokeResult = { passed: true };
  } catch (error) {
    document.querySelector("#result").textContent = `FAIL: ${error.stack}`;
    globalThis.smokeResult = { passed: false, error: String(error) };
    console.error(error);
  } finally {
    String.prototype.normalize = platform.normalize;
    String.prototype.toUpperCase = platform.upper;
    String.prototype.toLowerCase = platform.lower;
    Intl.Segmenter = platform.segmenter;
  }
</script>
